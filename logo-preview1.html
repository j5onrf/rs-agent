<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Batch 1: Pyramids & Deltas</title>
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: monospace; padding: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; text-align: center; }
    .svg-box { width: 160px; height: 160px; margin: 0 auto 16px; }
    svg { width: 100%; height: 100%; }
    h3 { font-size: 15px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <h1 style="text-align:center; margin-bottom:30px;">Batch 1: Pyramids & Deltas</h1>
  <div class="grid">
    <div class="card">
      <div class="svg-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <defs>
            <linearGradient id="p1-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00F2FE"/><stop offset="100%" stop-color="#4FACFE"/></linearGradient>
            <linearGradient id="p1-r" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4FACFE"/><stop offset="100%" stop-color="#3A7BD5"/></linearGradient>
          </defs>
          <polygon points="150,45 50,230 150,270" fill="url(#p1-l)"/>
          <polygon points="150,45 150,270 250,230" fill="url(#p1-r)" opacity="0.9"/>
          <line x1="150" y1="45" x2="150" y2="270" stroke="#FFF" stroke-width="2" stroke-opacity="0.4"/>
          <circle cx="150" cy="45" r="5" fill="#00F2FE"/>
        </svg>
      </div>
      <h3>1. 3D Faceted Crystal</h3>
    </div>
    <div class="card">
      <div class="svg-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <defs>
            <linearGradient id="p2-g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00F2FE"/><stop offset="100%" stop-color="#3A7BD5"/></linearGradient>
          </defs>
          <g transform="translate(150,155) scale(0.9) translate(-150,-150)">
            <polygon points="150,30 178,78 100,212 60,212" fill="url(#p2-g)"/>
            <polygon points="150,30 240,186 200,212 178,78" fill="#4FACFE"/>
            <polygon points="60,212 240,212 212,260 92,260" fill="#3A7BD5"/>
            <polygon points="100,212 200,212 150,126" fill="#0d1117"/>
          </g>
        </svg>
      </div>
      <h3>2. Penrose Tribar</h3>
    </div>
  </div>
</body>
</html>
