<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Batch 2: Mechanical Gears</title>
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: monospace; padding: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; text-align: center; }
    .svg-box { width: 160px; height: 160px; margin: 0 auto 16px; }
    svg { width: 100%; height: 100%; }
    h3 { font-size: 15px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <h1 style="text-align:center; margin-bottom:30px;">Batch 2: Mechanical Gears</h1>
  <div class="grid">
    <div class="card">
      <div class="svg-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <defs><linearGradient id="g1-g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00F2FE"/><stop offset="100%" stop-color="#3A7BD5"/></linearGradient></defs>
          <g transform="translate(150,150)">
            <circle cx="0" cy="0" r="75" fill="none" stroke="url(#g1-g)" stroke-width="26"/>
            <rect x="-13" y="-105" width="26" height="26" rx="4" fill="url(#g1-g)"/>
            <rect x="-13" y="79" width="26" height="26" rx="4" fill="url(#g1-g)"/>
            <rect x="-13" y="-105" width="26" height="26" rx="4" fill="url(#g1-g)" transform="rotate(60)"/>
            <rect x="-13" y="79" width="26" height="26" rx="4" fill="url(#g1-g)" transform="rotate(60)"/>
            <rect x="-13" y="-105" width="26" height="26" rx="4" fill="url(#g1-g)" transform="rotate(120)"/>
            <rect x="-13" y="79" width="26" height="26" rx="4" fill="url(#g1-g)" transform="rotate(120)"/>
            <circle cx="0" cy="0" r="32" fill="#0d1117" stroke="url(#g1-g)" stroke-width="8"/>
            <circle cx="0" cy="0" r="10" fill="#00F2FE"/>
          </g>
        </svg>
      </div>
      <h3>1. 6-Tooth Smol Gear</h3>
    </div>
    <div class="card">
      <div class="svg-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <defs><linearGradient id="g2-g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00F2FE"/><stop offset="100%" stop-color="#3A7BD5"/></linearGradient></defs>
          <g transform="translate(150,150)">
            <circle cx="0" cy="0" r="72" fill="none" stroke="url(#g2-g)" stroke-width="22"/>
            <polygon points="-8,-98 12,-98 6,-74 -8,-74" fill="url(#g2-g)"/>
            <polygon points="-8,-98 12,-98 6,-74 -8,-74" fill="url(#g2-g)" transform="rotate(90)"/>
            <polygon points="-8,-98 12,-98 6,-74 -8,-74" fill="url(#g2-g)" transform="rotate(180)"/>
            <polygon points="-8,-98 12,-98 6,-74 -8,-74" fill="url(#g2-g)" transform="rotate(270)"/>
            <polygon points="-4,-14 6,-2 -2,-2 4,14 -6,2 2,2" fill="#00F2FE"/>
          </g>
        </svg>
      </div>
      <h3>2. Ratchet Tachometer</h3>
    </div>
  </div>
</body>
</html>
