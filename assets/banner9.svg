<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 32" width="900" height="32" role="img" aria-label="Rs-Agent">
  <defs>
    <style>
      .n0 { animation: pulse 4.4s ease-in-out infinite 0.0s; }
      .n1 { animation: pulse 4.4s ease-in-out infinite 0.8s; }
      .n2 { animation: pulse 4.4s ease-in-out infinite 1.6s; }
      @keyframes pulse {
        0%, 100% { fill-opacity: 0.72; stroke-opacity: 0.72; }
        50% { fill-opacity: 1.0; stroke-opacity: 1.0; }
      }
    </style>
    <radialGradient id="rust_glow" cx="50%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line_fade_l" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="404" y2="0">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0"/>
      <stop offset="55%" stop-color="#334155" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="line_fade_r" gradientUnits="userSpaceOnUse" x1="496" y1="0" x2="844" y2="0">
      <stop offset="0%" stop-color="#9a3412" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#334155" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="32" rx="8" fill="#0d1117"/>
  <ellipse cx="450" cy="16" rx="200" ry="14" fill="url(#rust_glow)"/>

  <line x1="56" y1="16" x2="404" y2="16" stroke="url(#line_fade_l)" stroke-width="1.2"/>
  <line x1="496" y1="16" x2="844" y2="16" stroke="url(#line_fade_r)" stroke-width="1.2"/>

  <g fill="none" stroke-linecap="round">
    <line class="n0" x1="418" y1="16" x2="446.5" y2="16" stroke="#ea580c" stroke-width="1.25"/>
    <path class="n1" d="M453.5 16c10 0 12-4.2 28-4.2M453.5 16c10 0 12 4.2 28 4.2" stroke="#ce422b" stroke-width="1.2"/>
  </g>

  <circle class="n0" cx="416" cy="16" r="1.9" fill="#f59e0b"/>
  <circle class="n1" cx="450" cy="16" r="3.2" stroke="#ea580c" stroke-width="1.2" fill="#0d1117"/>
  <circle class="n1" cx="450" cy="16" r="1.3" fill="#f59e0b"/>
  <circle class="n2" cx="484" cy="11.8" r="1.8" fill="#ce422b"/>
  <circle class="n2" cx="484" cy="20.2" r="1.8" fill="#f59e0b"/>
