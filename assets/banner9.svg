<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 52" width="900" height="52" role="img" aria-label="Rs-Agent">
  <defs>
    <style>
      .n0 { animation: pulse 4.4s ease-in-out infinite 0.0s; }
      .n1 { animation: pulse 4.4s ease-in-out infinite 0.8s; }
      .n2 { animation: pulse 4.4s ease-in-out infinite 1.6s; }
      @keyframes pulse {
        0%, 100% { fill-opacity: 0.60; stroke-opacity: 0.60; }
        50% { fill-opacity: 1.0; stroke-opacity: 1.0; }
      }
    </style>
    <radialGradient id="rust_glow" cx="50%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line_fade_l" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="404" y2="0">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0"/>
      <stop offset="55%" stop-color="#334155" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="line_fade_r" gradientUnits="userSpaceOnUse" x1="496" y1="0" x2="844" y2="0">
      <stop offset="0%" stop-color="#9a3412" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#334155" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="52" rx="10" fill="#0d1117"/>
  <ellipse cx="450" cy="26" rx="200" ry="20" fill="url(#rust_glow)"/>

  <line x1="56" y1="26" x2="404" y2="26" stroke="url(#line_fade_l)" stroke-width="1"/>
  <line x1="496" y1="26" x2="844" y2="26" stroke="url(#line_fade_r)" stroke-width="1"/>

  <g fill="none" stroke-linecap="round">
    <line class="n0" x1="418" y1="26" x2="446.5" y2="26" stroke="#ea580c" stroke-width="1.3"/>
    <path class="n1" d="M453.5 26c10 0 12-4.5 28-4.5M453.5 26c10 0 12 4.5 28 4.5" stroke="#ce422b" stroke-width="1.25"/>
  </g>

  <circle class="n0" cx="416" cy="26" r="2.0" fill="#f59e0b"/>
  <circle class="n1" cx="450" cy="26" r="3.4" stroke="#ea580c" stroke-width="1.2" fill="#0d1117"/>
