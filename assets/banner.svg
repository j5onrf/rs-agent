<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Rs-Agent banner">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1520" />
      <stop offset="55%" stop-color="#0b1018" />
      <stop offset="100%" stop-color="#080b11" />
    </linearGradient>

    <radialGradient id="heroGlow" cx="334" cy="100" r="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#1d6fe8" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#080b11" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rightGlow" cx="680" cy="100" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080b11" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ringGrad" gradientUnits="userSpaceOnUse" x1="30" y1="30" x2="98" y2="98">
      <stop offset="0%" stop-color="#1cb5ff" />
      <stop offset="55%" stop-color="#2b84ea" />
      <stop offset="100%" stop-color="#2966d8" />
    </linearGradient>
    <linearGradient id="topArmGrad" gradientUnits="userSpaceOnUse" x1="72" y1="15" x2="22" y2="80">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="55%" stop-color="#00b4ff" />
      <stop offset="100%" stop-color="#2878ea" />
    </linearGradient>
    <linearGradient id="botArmGrad" gradientUnits="userSpaceOnUse" x1="106" y1="48" x2="56" y2="113">
      <stop offset="0%" stop-color="#2692ff" />
      <stop offset="65%" stop-color="#2d74e2" />
      <stop offset="100%" stop-color="#2a5bc8" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#030712" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded glass card -->
  <rect x="1" y="1" width="998" height="198" rx="18" fill="url(#cardBg)" stroke="#21262d" stroke-width="1.5" />
  <rect x="1" y="1" width="998" height="198" rx="18" fill="url(#heroGlow)" />
  <rect x="1" y="1" width="998" height="198" rx="18" fill="url(#rightGlow)" />
  <line x1="24" y1="1.5" x2="976" y2="1.5" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1" />

  <!-- Centered logo + wordmark lockup -->
  <svg x="272" y="38" width="124" height="124" viewBox="0 0 128 128">
    <circle cx="64" cy="64" r="31" fill="none" stroke="url(#ringGrad)" stroke-width="19" opacity="0.92" />
    <path fill="none" stroke="url(#botArmGrad)" stroke-width="19" stroke-linecap="round"
      filter="url(#softShadow)" opacity="0.94"
      d="M 106 48 C 113 84, 94 114, 56 113" />
    <circle cx="56" cy="113" r="6.2" fill="#1d4ed8" opacity="0.55" />
    <path fill="none" stroke="url(#topArmGrad)" stroke-width="19" stroke-linecap="round"
      filter="url(#softShadow)" opacity="0.95"
      d="M 72 15 C 34 14, 15 44, 22 80" />
    <circle cx="72" cy="15" r="6.2" fill="#67ffff" opacity="0.55" />
  </svg>

  <text x="432" y="123"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
    font-size="68" font-weight="800" letter-spacing="-2" fill="#f0f6fc">
    Rs-Agent
  </text>
</svg>
