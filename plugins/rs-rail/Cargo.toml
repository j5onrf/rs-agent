[package]
name = "rs-rail"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
anyhow = "1.0"
dirs = "5.0"
futures-util = "0.3"
rs_agent = { path = "../../", package = "rs-agent" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true
