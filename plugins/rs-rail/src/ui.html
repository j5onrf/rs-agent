<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<meta name="darkreader-lock" />
<title>RS Rail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
  :root {
    --bg: #0c0c0e;
    --panel: #111215;
    --card: #18191d;
    --hover: #202228;
    --border: #26282e;
    --nav-bg: #0e0f12;
    --code-bg: #0f1014;
    --code-border: #26282e;
    --code-head: #111215;
    --text: #e5e7eb;
    --muted: #8e95a3;
    --dim: #5c6370;
    --accent: #22c55e;
    --accent-fg: #05140a;
    --accent-bg: rgba(34, 197, 94, 0.12);
    --user-bg: #16261d;
    --user-border: #244732;
    --user-text: #ecfdf5;
    --cyan: #38bdf8;
    --err-text: #fca5a5;
    --del-bg: rgba(239, 68, 68, 0.14);
    --del-text: #fca5a5;
    --add-bg: rgba(34, 197, 94, 0.14);
    --add-text: #86efac;
    --mono: "JetBrains Mono", "JetBrainsMono Nerd Font", "JetBrainsMono NF", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --sans: "JetBrains Mono", "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --warn-bg: rgba(245, 158, 11, 0.08);
    --warn-border: rgba(245, 158, 11, 0.45);
    --warn-text: #fcd34d;
    --syn-kw: #8ab4f8;
    --syn-str: #86efac;
    --syn-num: #fcd34d;
    --syn-cmt: #717885;
    --code-size: 12px;
    --ligatures: none;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button:disabled { opacity: 0.42; cursor: not-allowed; filter: none; }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* Topbar */
  .topbar { height: 42px; min-height: 42px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; gap: 12px; }
  .tb-left, .tb-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand { font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 6px; color: var(--text); white-space: nowrap; }
  .pill { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 12px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .ctx-bar { width: 56px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .ctx-fill { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .2s; }
  .btn { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; color: var(--text); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-danger { background: var(--del-bg); color: var(--err-text); border-color: rgba(239,68,68,.4); }
  .btn-sm { padding: 2px 8px; font-size: 11px; }
  .btn-icon { padding: 4px 6px; }
  .btn-send-circle { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: background .12s, border-color .12s, color .12s, filter .12s; }
  .btn-send-circle:hover { background: var(--hover); color: var(--text); }
  .btn-send-circle.ready { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn-send-circle.ready:hover { filter: brightness(1.08); }
  .btn-send-circle.stop { background: var(--del-bg); border-color: rgba(239,68,68,.45); color: var(--err-text); }
  .btn-send-circle.stop:hover { filter: brightness(1.08); }
  .tok-k { color: var(--syn-kw); }
  .tok-s { color: var(--syn-str); }
  .tok-n { color: var(--syn-num); }
  .tok-c { color: var(--syn-cmt); font-style: italic; }

  /* Main 3-pane body */
  .main { flex: 1; display: flex; min-height: 0; }
  .sidebar-left { width: 235px; min-width: 200px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .sidebar-right { width: 280px; min-width: 235px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .sidebar-left.hidden, .sidebar-right.hidden { display: none; }
  .sec-head { padding: 10px 12px 6px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .rs-head { padding: 8px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .proj-list { flex: 1; overflow-y: auto; padding: 6px 6px 12px; }
  .proj-item { padding: 6px 8px; border-radius: 7px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; border: 1px solid transparent; }
  .proj-item:hover { background: var(--hover); }
  .proj-item.active { background: var(--active-bg, var(--user-bg)); border-color: var(--active-border, var(--user-border)); }
  .proj-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .proj-badge { width: 20px; height: 20px; border-radius: 5px; background: var(--card); border: 1px solid var(--border); color: var(--muted); font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; text-transform: uppercase; }
  .proj-item.active .proj-badge { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .proj-name { font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-acts { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .proj-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); opacity: 0; transition: opacity .12s; }
  .proj-dot.dirty { background: var(--accent); opacity: 0.9; }
  .proj-item:hover .proj-dot { opacity: 0.75; }
  .proj-item:hover .proj-dot.dirty { opacity: 1; }
  .proj-del { background: transparent; border: none; padding: 2px; border-radius: 4px; color: var(--muted); cursor: pointer; display: none; align-items: center; justify-content: center; line-height: 0; }
  .proj-item:hover .proj-del { display: inline-flex; }
  .proj-del:hover { color: var(--err-text); background: var(--del-bg); }
  .proj-hover { position: fixed; z-index: 60; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; min-width: 210px; max-width: 260px; box-shadow: 0 12px 30px rgba(0,0,0,.5); display: none; flex-direction: column; gap: 5px; font-size: 11.5px; }
  .proj-hover.open { display: flex; }
  .ph-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; color: var(--text); }
  .ph-kbd { font-size: 10px; color: var(--dim); border: 1px solid var(--border); background: var(--card); border-radius: 4px; padding: 1px 5px; }
  .ph-row { color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }

  /* Right Sidebar 2-Pane Split (ThinkRail proportions: Top Files + Bottom [TASK | Memory]) */
  .rs-top { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--border); }
  .file-list { flex: 1; overflow-y: auto; padding: 2px 6px 8px; display: flex; flex-direction: column; gap: 1px; }
  .file-row { padding: 5px 8px; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; gap: 6px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .file-row:hover { background: var(--hover); color: var(--text); }
  .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-del { background: transparent; border: none; color: var(--dim); cursor: pointer; font-size: 10px; padding: 1px 4px; border-radius: 4px; display: none; }
  .file-row:hover .file-del, .file-del.arm { display: inline-block; }
  .file-del.arm { color: var(--err-text); background: var(--del-bg); }
  .rs-bot { height: 42%; min-height: 170px; display: flex; flex-direction: column; flex-shrink: 0; }
  .rs-tabs { display: flex; gap: 4px; }
  .rs-tab { background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 2px 7px; font-size: 11px; color: var(--dim); cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .rs-tab.active { background: var(--card); border-color: var(--border); color: var(--text); }
  .rs-pane { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .rs-pane.open { display: flex; }
  .task-body { flex: 1; overflow-y: auto; padding: 6px 12px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: pre-wrap; line-height: 1.45; }
  .mem-input { flex: 1; margin: 4px 10px 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 8px; font-family: var(--mono); font-size: 11.5px; color: var(--text); resize: none; outline: none; line-height: 1.45; }
  .mem-input:focus { border-color: var(--accent); }
  .rs-note { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Center Chat */
  .center { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .stream { flex: 1; overflow-y: auto; padding: 18px 24px; display: flex; flex-direction: column; gap: 14px; }
  .turn-wrap { max-width: 880px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .msg-user { align-self: flex-end; background: var(--user-bg); border: 1px solid var(--user-border); color: var(--user-text); padding: 8px 13px; border-radius: 10px; max-width: 78%; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
  .msg-assistant { display: flex; flex-direction: column; gap: 8px; }
  .think-box { color: var(--dim); font-size: 12px; }
  .think-box summary { cursor: pointer; user-select: none; list-style: none; display: inline-flex; align-items: center; gap: 7px; padding: 2px 0; border: none; background: transparent; color: var(--muted); font-size: 12px; outline: none; }
  .think-box summary::-webkit-details-marker { display: none; }
  .think-step { color: var(--text); font-weight: 500; }
  .think-meta { color: var(--muted); }
  .think-box summary:hover .think-meta, .think-box summary:hover .think-chev { color: var(--text); opacity: 1; }
  .think-chev { transition: transform .15s; flex-shrink: 0; opacity: 0.7; }
  .think-box[open] .think-chev { transform: rotate(90deg); }
  .think-body { display: flex; align-items: flex-start; gap: 7px; margin: 5px 0 4px 6px; padding-left: 12px; border-left: 1px solid var(--border); color: var(--muted); opacity: 0.85; font-style: italic; font-size: 12px; line-height: 1.48; }
  .think-star { flex-shrink: 0; opacity: 0.72; margin-top: 2px; }
  .think-text { white-space: pre-wrap; min-width: 0; }
  .ans-row { display: flex; align-items: flex-start; gap: 9px; line-height: 1.55; }
  .bullet { color: var(--cyan); font-size: 12px; margin-top: 2px; flex-shrink: 0; }
  .ans-body { flex: 1; min-width: 0; word-break: break-word; }
  .ans-body h2, .ans-body h3, .ans-body h4 { margin: 10px 0 6px; font-weight: 600; color: var(--text); }
  .ans-body h2 { font-size: 15px; } .ans-body h3 { font-size: 14px; } .ans-body h4 { font-size: 13px; }
  .ans-body p { margin: 0 0 8px; }
  .ans-body p:last-child { margin-bottom: 0; }
  .ans-body ul, .ans-body ol { margin: 0 0 8px; padding-left: 18px; }
  .ans-body li { margin: 2px 0; }
  .ans-body hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .ans-body code { font-family: var(--mono); font-size: var(--code-size); background: var(--card); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--code-border); font-variant-ligatures: var(--ligatures); }
  .code-wrap { position: relative; margin: 8px 0; border: 1px solid var(--code-border); border-radius: 8px; background: var(--code-bg); overflow: hidden; }
  .code-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px; background: var(--code-head); border-bottom: 1px solid var(--code-border); font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .code-wrap pre { margin: 0; padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: var(--code-size); line-height: 1.45; font-variant-ligatures: var(--ligatures); }

  /* Tool Cards & Framed Error Card */
  .tool-card { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; overflow: hidden; }
  .tool-head { padding: 7px 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 12px; cursor: pointer; }
  .tool-title { display: flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-brief { color: var(--muted); }
  .tool-summary { color: var(--dim); font-size: 11.5px; padding: 0 11px 7px 26px; font-family: var(--mono); }
  .tool-err { color: var(--err-text); }
  .err-card { max-width: 880px; width: 100%; margin: 0 auto; border: 1px solid rgba(239,68,68,.42); background: var(--del-bg); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .err-msg { color: var(--err-text); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .err-acts { display: flex; justify-content: flex-end; }
  .diff-box { border-top: 1px solid var(--border); background: var(--code-bg); font-family: var(--mono); font-size: var(--code-size); overflow-x: auto; padding: 4px 0; font-variant-ligatures: var(--ligatures); }
  .diff-line { padding: 0 10px 0 0; white-space: pre; display: flex; gap: 10px; }
  .diff-line.ctx { color: var(--muted); }
  .diff-num { width: 46px; padding: 1px 6px; text-align: right; color: var(--dim); user-select: none; flex-shrink: 0; }
  .diff-line.del .diff-num { background: var(--del-bg); color: var(--del-text); }
  .diff-line.add .diff-num { background: var(--add-bg); color: var(--add-text); }
  .tool-raw { border-top: 1px solid var(--border); padding: 8px 11px; margin: 0; font-family: var(--mono); font-size: var(--code-size); color: var(--muted); white-space: pre-wrap; max-height: 240px; overflow-y: auto; display: none; font-variant-ligatures: var(--ligatures); }
  .tool-card.open .tool-raw { display: block; }

  /* Security Gate Card */
  .gate-card { border: 1px solid var(--warn-border); background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .gate-title { color: var(--warn-text); font-weight: 600; font-size: 12px; }
  .gate-cmd { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 6px 8px; border-radius: 5px; border: 1px solid var(--border); overflow-x: auto; }
  .gate-actions { display: flex; gap: 8px; }

  /* Composer */
  .composer-wrap { padding: 8px 24px 16px; background: var(--bg); }
  .composer { position: relative; max-width: 880px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; transition: border-color .15s; }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
  .img-strip { display: none; gap: 6px; flex-wrap: wrap; }
  .img-strip.open { display: flex; }
  .img-thumb { position: relative; width: 44px; height: 44px; border-radius: 6px; border: 1px solid var(--border); overflow: hidden; background: var(--bg); }
  .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-rm { position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; border: none; background: rgba(0,0,0,.75); color: #fff; font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .msg-imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .msg-img { max-width: 180px; max-height: 140px; border-radius: 6px; border: 1px solid var(--border); object-fit: cover; display: block; }
  .composer textarea { width: 100%; background: transparent; border: none; outline: none; resize: none; min-height: 36px; max-height: 180px; line-height: 1.45; color: var(--text); }
  .comp-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .comp-left, .comp-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .comp-select { background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; font-size: 11.5px; color: var(--muted); }
  .skill-chip { font-size: 11px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--cyan); color: var(--cyan); background: color-mix(in srgb, var(--cyan) 14%, transparent); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .skill-chip.off { border-color: var(--border); color: var(--muted); background: var(--card); opacity: .72; }
  .skill-chip.off:hover { opacity: 1; color: var(--text); }
  .chip-x { opacity: .65; font-size: 10px; line-height: 1; padding: 0 1px; }
  .chip-x:hover { opacity: 1; color: var(--err-text); }

  /* Inline / Command Autocomplete */
  .ac-pop { position: absolute; bottom: calc(100% + 8px); left: 0; right: 0; max-height: min(220px, 40vh); overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 5px; display: none; flex-direction: column; gap: 2px; box-shadow: 0 14px 32px rgba(0,0,0,.5); z-index: 30; }
  .ac-pop.open { display: flex; }
  .ac-item { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .ac-item.hl, .ac-item:hover { background: var(--hover); color: var(--text); }
  .ac-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ac-key { font-family: var(--mono); color: var(--text); font-weight: 600; white-space: nowrap; }
  .ac-desc { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Modals */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.68); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-backdrop.open { display: flex; }
  .modal { width: 760px; max-width: 94vw; height: 540px; max-height: 88vh; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
  .modal-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .modal-body { flex: 1; display: flex; min-height: 0; }
  .modal-nav { width: 190px; border-right: 1px solid var(--border); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; background: var(--nav-bg); }
  .nav-group { font-size: 10.5px; color: var(--dim); padding: 8px 10px 4px; font-weight: 600; letter-spacing: .06em; }
  .nav-btn { text-align: left; background: transparent; border: 1px solid transparent; padding: 7px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .nav-btn:hover { background: var(--hover); color: var(--text); }
  .nav-btn.active { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); font-weight: 500; }
  .modal-pane { flex: 1; padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; gap: 12px; }
  .setting-row.active-slot { border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: var(--accent-bg); }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field input, .field select { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; color: var(--text); }
  .switch { width: 32px; height: 18px; border-radius: 99px; border: 1px solid var(--border); background: var(--bg); position: relative; cursor: pointer; flex-shrink: 0; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
  .switch.on { background: var(--accent); border-color: var(--accent); }
  .switch.on::after { transform: translateX(14px); background: var(--accent-fg); }
  .skills-filter { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; outline: none; font-size: 12px; }
  .skills-filter:focus { border-color: var(--cyan); }
  .theme-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .theme-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; cursor: pointer; display: flex; align-items: center; gap: 9px; text-align: left; min-width: 0; }
  .theme-card:hover { background: var(--hover); }
  .theme-card.active { border-color: var(--accent); background: var(--accent-bg); }

<script>
let STATE = null;
let ACTIVE_TAB = "providers";
let STREAMING = false;
let skillFilter = "";
let lastSentPayload = null;

const BUILTIN_THEMES = [
  { id:"dark-default", name:"Dark Default", mode:"dark",  bg:"#09090b", panel:"#0f0f12", card:"#16161a", border:"#232329", text:"#ececef", muted:"#8e8e98", accent:"#1a73e8", cyan:"#669df6", active_bg:"#151923", active_border:"#28344d" },
  { id:"dark-green",   name:"Dark Green",   mode:"dark",  bg:"#131314", panel:"#1e1f20", card:"#282a2c", border:"#333538", text:"#e3e3e3", muted:"#c4c7c5", accent:"#1e8e3e", cyan:"#5bb974", active_bg:"#18291e", active_border:"#2b5337" },
  { id:"pure-light",   name:"Pure Light",   mode:"light", bg:"#ffffff", panel:"#f8f9fa", card:"#f1f3f4", border:"#dadce0", text:"#1f1f1f", muted:"#5f6368", accent:"#1a73e8", cyan:"#1a73e8", active_bg:"#e8f0fe", active_border:"#a8c7fa" }
];

const DEFAULT_APPEARANCE = {
  theme: "dark-default",
  uiFont: "JetBrains Mono",
  codeFont: "JetBrains Mono",
  codeSize: 12,
  ligatures: false
};

function hexLum(hex) {
  const h = String(hex || "").replace("#", "");
  if (h.length < 6) return 0;
  const r = parseInt(h.slice(0,2), 16) || 0, g = parseInt(h.slice(2,4), 16) || 0, b = parseInt(h.slice(4,6), 16) || 0;
  return (r * 299 + g * 587 + b * 114) / 1000;
}

function getAppearance() {
  try {
    const c = { ...DEFAULT_APPEARANCE, ...JSON.parse(localStorage.getItem("rs_rail_appearance") || "{}") };
    if (c.theme === "pitch-dark") c.theme = "dark-default";
    return c;
  }
  catch { return { ...DEFAULT_APPEARANCE }; }
}

function allThemes() {
  return [...BUILTIN_THEMES, ...(STATE?.themes || [])];
}

function applyAppearance(next) {
  const cfg = next ? { ...getAppearance(), ...next } : getAppearance();
  localStorage.setItem("rs_rail_appearance", JSON.stringify(cfg));
  let t = allThemes().find((x) => x.id === cfg.theme);
  if (t) {
    localStorage.setItem("rs_rail_theme_cache", JSON.stringify(t));
  } else {
    try {
      const cached = JSON.parse(localStorage.getItem("rs_rail_theme_cache") || "null");
      if (cached && cached.id === cfg.theme) t = cached;
    } catch {}
  }
  if (!t) t = BUILTIN_THEMES[0];

  const isLight = t.mode === "light";
  const accentFg = hexLum(t.accent) > 145 ? "#05140a" : "#ffffff";

  const vars = {
    "--bg": t.bg, "--panel": t.panel, "--card": t.card, "--border": t.border,
    "--text": t.text, "--muted": t.muted,
    "--dim": `color-mix(in srgb, ${t.muted} 70%, ${t.bg})`,
    "--hover": `color-mix(in srgb, ${t.text} 6%, ${t.card})`,
    "--nav-bg": `color-mix(in srgb, ${t.bg} 55%, ${t.panel})`,
    "--code-bg": `color-mix(in srgb, ${t.bg} ${isLight ? "35%" : "75%"}, ${t.panel})`,
    "--code-border": t.border,
    "--code-head": t.panel,
    "--accent": t.accent, "--accent-fg": accentFg,
    "--accent-bg": `color-mix(in srgb, ${t.accent} 14%, transparent)`,
    "--user-bg": t.user_bg || `color-mix(in srgb, ${t.accent} ${isLight ? "11%" : "16%"}, ${t.panel})`,
    "--user-border": t.user_border || `color-mix(in srgb, ${t.accent} ${isLight ? "34%" : "42%"}, ${t.border})`,
    "--user-text": t.text,
    "--active-bg": t.active_bg || `color-mix(in srgb, ${t.accent} 16%, ${t.panel})`,
    "--active-border": t.active_border || `color-mix(in srgb, ${t.accent} 48%, ${t.border})`,
    "--cyan": t.cyan || t.accent,
    "--err-text": isLight ? "#dc2626" : "#fca5a5",
    "--del-bg": isLight ? "rgba(220,38,38,0.10)" : "rgba(239,68,68,0.14)",
    "--del-text": isLight ? "#b91c1c" : "#fca5a5",
    "--add-bg": isLight ? "rgba(22,163,74,0.10)" : "rgba(34,197,94,0.14)",
    "--add-text": isLight ? "#15803d" : "#86efac",
    "--warn-bg": isLight ? "rgba(217,119,6,0.10)" : "rgba(245,158,11,0.08)",
    "--warn-border": isLight ? "rgba(217,119,6,0.45)" : "rgba(245,158,11,0.45)",
    "--warn-text": isLight ? "#b45309" : "#fcd34d",
    "--syn-kw": isLight ? "#1d4ed8" : "#8ab4f8",
    "--syn-str": isLight ? "#15803d" : "#86efac",
    "--syn-num": isLight ? "#b45309" : "#fcd34d",
    "--syn-cmt": `color-mix(in srgb, ${t.muted} 70%, ${t.bg})`,
  };
  const root = document.documentElement.style;
  root.colorScheme = isLight ? "light" : "dark";
  for (const [k, v] of Object.entries(vars)) root.setProperty(k, v);
  const uiMap = {
    "JetBrains Mono": '"JetBrains Mono", "JetBrainsMono Nerd Font", "JetBrainsMono NF", ui-monospace, monospace',
    "Geist": '"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
    "System": '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
  };
  const codeMap = {
    "JetBrains Mono": '"JetBrains Mono", "JetBrainsMono Nerd Font", "JetBrainsMono NF", ui-monospace, SFMono-Regular, Menlo, monospace',
    "Fira Code": '"Fira Code", "JetBrains Mono", ui-monospace, monospace',
    "System": 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace'
  };
  root.setProperty("--sans", uiMap[cfg.uiFont] || uiMap["JetBrains Mono"]);
  root.setProperty("--mono", codeMap[cfg.codeFont] || codeMap["JetBrains Mono"]);
  root.setProperty("--code-size", `${cfg.codeSize}px`);
  root.setProperty("--ligatures", cfg.ligatures ? "normal" : "none");
}
applyAppearance();

const SLASH_CMDS = [
  { cmd: "/task", desc: "Run autonomous goal loop" },
  { cmd: "/r", desc: "Reset active session" },
  { cmd: "/s", desc: "Attach or detach skills (max 3)" },
  { cmd: "/p", desc: "Select agent profile" },
  { cmd: "/ms", desc: "Providers & models" },
  { cmd: "/tk", desc: "Toggle auto-expand thinking" },
  { cmd: "/export", desc: "Export transcript to .rs/transcripts/" },
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderProseBlock(raw) {
  const inline = (s) => esc(s).replace(/`([^`]+)`|\*\*([^*]+)\*\*/g, (_, code, bold) =>
    code !== undefined ? `<code>${code}</code>` : `<strong>${bold}</strong>`
  );
  const lines = raw.split(/\r?\n/);
  let html = "", listTag = "", para = [];
  const flushPara = () => { if (para.length) { html += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
  const closeList = () => { if (listTag) { html += `</${listTag}>`; listTag = ""; } };
  for (const line of lines) {
    const t = line.trim();
    if (!t) { flushPara(); closeList(); continue; }
    if (t === "---" || t === "***") { flushPara(); closeList(); html += "<hr>"; continue; }
    const hm = line.match(/^(#{1,3})\s+(.+)$/);
    if (hm) {
      flushPara(); closeList();
      const tag = hm[1].length === 1 ? "h2" : (hm[1].length === 2 ? "h3" : "h4");
      html += `<${tag}>${inline(hm[2])}</${tag}>`;
      continue;
    }
    const ulm = line.match(/^\s*[-*]\s+(.+)$/);
    const olm = !ulm && line.match(/^\s*\d+\.\s+(.+)$/);
    if (ulm || olm) {
      flushPara();
      const tag = ulm ? "ul" : "ol";
      if (listTag !== tag) { closeList(); html += `<${tag}>`; listTag = tag; }
      html += `<li>${inline((ulm || olm)[1])}</li>`;
      continue;
    }
    closeList();
    para.push(line);
  }
  flushPara();
  closeList();
  return html;
}

function highlightCode(raw) {
  const re = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|("{3}[\s\S]*?"{3}|'{3}[\s\S]*?'{3}|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(fn|let|mut|pub|struct|enum|impl|trait|match|if|elif|else|for|while|loop|return|use|mod|async|await|const|static|type|where|def|class|import|from|try|except|finally|raise|with|as|pass|in|not|and|or|is|lambda|yield|None|True|False|function|export|default|switch|case|break|continue|new|this|true|false|null|undefined|var|int|void|bool|str|self|Self)\b|\b(\d+(?:\.\d+)?)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    if (m.index > last) out += esc(raw.slice(last, m.index));
    const cls = m[1] ? "tok-c" : m[2] ? "tok-s" : m[3] ? "tok-k" : "tok-n";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(raw.slice(last));
}

function renderMarkdown(text) {
  const src = String(text || "");
  const re = /```([^\n`]*)\r?\n([\s\S]*?)```/g;
  const codeBlock = (lang, code) =>
    `<div class="code-wrap"><div class="code-head"><span>${esc(lang.trim() || "text")}</span><button class="btn btn-sm" onclick="navigator.clipboard.writeText(this.closest('.code-wrap').querySelector('pre').innerText)">Copy</button></div><pre>${highlightCode(code)}</pre></div>`;
  let html = "", last = 0, m;
  while ((m = re.exec(src)) !== null) {
    if (m.index > last) html += renderProseBlock(src.slice(last, m.index));
    html += codeBlock(m[1], m[2]);
    last = re.lastIndex;
  }
  const tail = src.slice(last);
  const open = tail.match(/^([\s\S]*?)```([^\n`]*)\r?\n([\s\S]*)$/);
  if (open) {
    if (open[1]) html += renderProseBlock(open[1]);
    html += codeBlock(open[2], open[3]);
  } else if (tail) {
    html += renderProseBlock(tail);
  }
  return html || "<p></p>";
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text() || res.statusText);
  return res.json();
}

async function loadState(project) {
  closeAc();
  const q = project ? `?project=${encodeURIComponent(project)}` : "";
  STATE = await api(`/api/state${q}`);
  renderAll();
}

function openSettings(tab) {
  if (tab) ACTIVE_TAB = tab;
  $("modal-settings").classList.add("open");
  renderModalTab();
}

function loadPinnedMap() {
  try { return JSON.parse(localStorage.getItem("rs_rail_pinned_skills") || "{}"); }
  catch { return {}; }
}
function savePinnedMap(map) {
  localStorage.setItem("rs_rail_pinned_skills", JSON.stringify(map));
}
function syncPinnedSkills(proj, activeSkills) {
  const map = loadPinnedMap();
  const list = Array.isArray(map[proj]) ? [...map[proj]] : [];
  let changed = false;
  for (const sk of activeSkills) {
    if (!list.includes(sk)) { list.push(sk); changed = true; }
  }
  const avail = new Set(STATE?.skills || []);
  const clean = avail.size ? list.filter((s) => avail.has(s)) : list;
  if (clean.length !== list.length) changed = true;
  if (changed) { map[proj] = clean; savePinnedMap(map); }
  return clean;
}
function unpinSkill(proj, sk) {
  const map = loadPinnedMap();
  if (Array.isArray(map[proj])) {
    map[proj] = map[proj].filter((x) => x !== sk);
    savePinnedMap(map);
  }
}

function setRsNote(msg) {
  const el = $("rs-note");
  el.textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent = ""; }, 4000);
}

function renderAll() {
  if (!STATE) return;
  const ap = STATE.active_project;
  const headLabel = ap.profile_name && ap.profile_name !== ap.name ? `${ap.name} · ${ap.profile_name}` : ap.name;
  $("tb-profile").textContent = `${headLabel} · ${ap.hud_summary}`;
  $("tb-git").textContent = ap.git || "git: [none]";
  $("btn-model-pill").textContent = `${STATE.provider.model} · ${STATE.provider.endpoint}`;
  $("btn-img").style.display = STATE.provider.is_local ? "none" : "inline-flex";
  disarmReset();
  $("btn-reset").style.display = (ap.history && ap.history.length) ? "inline-flex" : "none";

  $("sidebar-right").classList.toggle("hidden", STATE.ui_prefs?.show_right_panel === false);
  const ctxMax = STATE.provider.max_tokens || 8192;
  const ctxLbl = ctxMax >= 1000 ? `${(ctxMax/1000).toFixed(1)}k` : ctxMax;
  const stPill = $("tb-stats");
  if (ap.last_stats) {
    const s = ap.last_stats;
    const used = (s.prompt_tokens || 0) + (s.completion_tokens || 0);
    const pct = Math.min(100, (used / Math.max(1, ctxMax)) * 100);
    const cPct = s.cached_tokens > 0 && s.prompt_tokens > 0
      ? Math.min(100, Math.round((s.cached_tokens / s.prompt_tokens) * 100))
      : 0;
    const chPart = cPct > 0 ? `CH ${cPct}% · ` : "";
    const spdPart = `${(s.tps || 0).toFixed(1)} t/s`;
    stPill.textContent = `${chPart}${spdPart}`;
    stPill.style.display = "inline-flex";
    $("tb-usage").textContent = `${pct.toFixed(1)}% / ${ctxLbl}`;
    $("tb-ctx-fill").style.width = `${pct}%`;
  } else {
    stPill.style.display = "none";
    $("tb-usage").textContent = `ctx ${ctxLbl}`;
    $("tb-ctx-fill").style.width = "0%";
  }

  // Projects list
  const plist = $("proj-list");
  plist.innerHTML = "";
  const hc = $("proj-hover");
  STATE.projects.forEach((p, idx) => {
    const el = document.createElement("div");
    el.className = "proj-item" + (p.name === ap.name ? " active" : "");
    const abbr = p.name.replace(/[^a-zA-Z0-9]/g, "").slice(0, 2) || p.name.slice(0, 2);
    const delBtn = p.file_count > 0
      ? `<button class="proj-del" title="Delete ${p.file_count} file(s)"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h11"/><path d="M6 2.5h4"/><path d="M4.5 4.5l.7 9h5.6l.7-9"/></svg></button>`
      : "";
    el.innerHTML = `<div class="proj-left"><span class="proj-badge">${esc(abbr)}</span><span class="proj-name">${esc(p.name)}</span></div><div class="proj-acts">${delBtn}<span class="proj-dot ${p.dirty ? "dirty" : ""}"></span></div>`;
    el.onclick = () => { hc.classList.remove("open"); loadState(p.name); };
    const db = el.querySelector(".proj-del");
    if (db) {
      db.onclick = async (e) => {
        e.stopPropagation();
        if (!confirm(`Delete ${p.file_count} file(s) in ${p.name}?`)) return;
        await api("/api/project/clean", { name: p.name });
        hc.classList.remove("open");
        await loadState();
      };
    }
    el.onmouseenter = () => {
      const r = el.getBoundingClientRect();
      const kbd = idx < 9 ? `<span class="ph-kbd">Ctrl+${idx + 1}</span>` : "";
      const filesTxt = p.file_count ? `${p.file_count} file(s)` : "empty";
      hc.innerHTML = `<div class="ph-top"><span>${esc(p.name)}</span>${kbd}</div><div class="ph-row"><span>Profile</span><span>${esc(p.profile_name)}</span></div><div class="ph-row"><span>Workspace</span><span>${filesTxt}</span></div><div class="ph-row"><span>Git</span><span>${p.dirty ? "modified" : "clean"}</span></div>`;
      hc.style.left = `${r.right + 8}px`;
      hc.style.top = `${Math.min(r.top, window.innerHeight - 110)}px`;
      hc.classList.add("open");
    };
    el.onmouseleave = () => hc.classList.remove("open");
    plist.appendChild(el);
  });

  const rSel = $("sel-reasoning");
  if (ap.reasoning && !Array.from(rSel.options).some(o => o.value === ap.reasoning)) {
    const opt = document.createElement("option");
    opt.value = ap.reasoning;
    opt.textContent = /^\d+$/.test(ap.reasoning) ? `t${ap.reasoning}` : ap.reasoning;
    rSel.appendChild(opt);
  }
  rSel.value = ap.reasoning || "";



  const pinned = syncPinnedSkills(ap.name, ap.active_skills || []);
  const sbar = $("skills-bar");
  sbar.innerHTML = "";
  for (const sk of pinned) {
    const on = (ap.active_skills || []).includes(sk);
    const chip = document.createElement("button");
    chip.className = "skill-chip" + (on ? "" : " off");
    chip.innerHTML = `<span>${esc(sk)}</span><span class="chip-x">✕</span>`;
    chip.onclick = async () => {
      if (!on && (ap.active_skills || []).length >= 3) return;
      await api("/api/settings/profile", { skill_toggle: sk });
      await loadState();
    };
    chip.querySelector(".chip-x").onclick = async (e) => {
      e.stopPropagation();
      unpinSkill(ap.name, sk);
      if (on) { await api("/api/settings/profile", { skill_toggle: sk }); await loadState(); }
      else renderAll();
    };
    sbar.appendChild(chip);
  }

  // Right sidebar: Top Files + Bottom [TASK | Memory]
  const files = ap.files || [];
  $("files-count").textContent = files.length;
  const flist = $("file-list");
  flist.innerHTML = "";
  if (!files.length) {
    flist.innerHTML = `<div class="muted" style="padding:4px 8px;">Empty workspace</div>`;
  } else {
    for (const f of files) {
      const row = document.createElement("div");
      row.className = "file-row";
      row.innerHTML = `<span class="file-name" title="${esc(f)}">${esc(f)}</span><button class="file-del" title="Delete file">✕</button>`;
      row.onclick = async () => {
        try {
          const res = await api(`/api/file?path=${encodeURIComponent(f)}`);
          $("mf-title").textContent = res.path;
          $("mf-body").innerHTML = highlightCode(res.content);
          $("modal-file").classList.add("open");
        } catch (err) { setRsNote(err.message); }
      };
      const del = row.querySelector(".file-del");
      del.onclick = async (e) => {
        e.stopPropagation();
        if (!del.classList.contains("arm")) {
          del.classList.add("arm");
          del.textContent = "del?";
          setTimeout(() => { del.classList.remove("arm"); del.textContent = "✕"; }, 2200);
          return;
        }
        await api("/api/file/delete", { path: f });
        await loadState();
      };
      flist.appendChild(row);
    }
  }

  $("task-body").textContent = ap.task_md || (ap.is_agent ? "No TASK.md found. Click /task above to run or set a goal." : "Chat mode (no tools).");
  const rt = $("btn-run-task");
  rt.disabled = !ap.is_agent;
  rt.textContent = !ap.is_agent ? "Chat" : (ap.task_md ? "Run" : "/task");

  const memEl = $("mem-input");
  if (document.activeElement !== memEl) memEl.value = ap.memory || "";

  applyAppearance();
  updateSendReady();
  renderHistory();
  if ($("modal-settings").classList.contains("open")) renderModalTab();
}

function renderHistory() {
  const stream = $("stream");
  const msgs = STATE.active_project.history || [];
  if (!msgs.length) {
    stream.innerHTML = "";
    stream.appendChild(createEmpty());
    return;
  }
  stream.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "turn-wrap";
  let step = 0, inRound = false;
  for (const m of msgs) {
    if (m.role === "user") {
      step = 0; inRound = false;
      wrap.appendChild(buildUserEl(m.content || "", m.images || []));
    } else if (m.role === "assistant") {
      step += 1; inRound = true;
      wrap.appendChild(buildAssistantEl(m.reasoning || "", m.content || "", m.elapsed_s, step));
    } else if (m.role === "tool_card") {
      if (!inRound) { step += 1; inRound = true; }
      wrap.appendChild(buildToolCard(m));
    }
  }
  stream.appendChild(wrap);
  stream.scrollTop = stream.scrollHeight;
}

function buildUserEl(text, images) {
  const u = document.createElement("div");
  u.className = "msg-user";
  if (images && images.length) {
    const row = document.createElement("div");
    row.className = "msg-imgs";
    for (const src of images) {
      const im = document.createElement("img");
      im.className = "msg-img";
      im.src = src;
      row.appendChild(im);
    }
    u.appendChild(row);
  }
  if (text) {
    const t = document.createElement("div");
    t.textContent = text;
    u.appendChild(t);
  }
  return u;
}

function createEmpty() {
  const d = document.createElement("div");
  d.id = "empty-state";
  d.className = "empty-state";
  const ap = STATE?.active_project;
  const model = STATE?.provider?.model || "";
  if (!ap) {
    d.innerHTML = `<div style="font-size:16px;color:var(--text);font-weight:600;margin-bottom:6px;">Ready</div><div>Loading workspace...</div>`;
    return d;
  }
  if (!ap.is_agent) {
    d.innerHTML = `<div style="font-size:16px;color:var(--text);font-weight:600;margin-bottom:6px;">Ready in chat</div><div>${esc(model)} · pure conversation · <code>/</code> for commands</div>`;
    return d;
  }
  const userFiles = (ap.files || []).filter((f) => !f.startsWith(".rs/")).length;
  const sub = ap.task_md
    ? `TASK.md loaded · ${esc(ap.hud_summary)} · <code>/task</code> to run`
    : userFiles > 0
      ? `${userFiles} file(s) · ${esc(ap.profile_name)} · ${esc(ap.hud_summary)}`
      : `${esc(ap.profile_name)} · ${esc(ap.hud_summary)} · <code>/</code> for commands`;
  d.innerHTML = `<div style="font-size:16px;color:var(--text);font-weight:600;margin-bottom:6px;">What should we build in ${esc(ap.name)}?</div><div>${sub}</div>`;
  return d;
}

const THINK_CHEV = `<svg class="think-chev" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg>`;
const THINK_STAR = `<svg class="think-star" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg>`;
function thinkMeta(len, elapsed) {
  if (typeof elapsed === "number") return elapsed >= 10 ? `${Math.round(elapsed)}s` : `${elapsed.toFixed(1)}s`;
  return `~${Math.max(1, Math.round(len / 4))}t`;
}

function stepTitle(n) {
  return STATE?.active_project?.is_agent ? `Step ${n}` : "Thought";
}

function buildAssistantEl(reasoning, content, elapsed, step) {
  const box = document.createElement("div");
  box.className = "msg-assistant";
  if (reasoning) {
    const det = document.createElement("details");
    det.className = "think-box";
    if (STATE?.ui_prefs?.show_thinking !== false) det.open = true;
    det.innerHTML = `<summary><span class="think-step">${esc(stepTitle(step || 1))}</span><span class="think-meta">${thinkMeta(reasoning.length, elapsed)}</span>${THINK_CHEV}</summary><div class="think-body">${THINK_STAR}<span class="think-text">${esc(reasoning)}</span></div>`;
    box.appendChild(det);
  }
  if (content) {
    const row = document.createElement("div");
    row.className = "ans-row";
    row.innerHTML = `<span class="bullet">●</span><div class="ans-body">${renderMarkdown(content)}</div>`;
    box.appendChild(row);
  }
  return box;
}

function buildToolCard(t) {
  const card = document.createElement("div");
  card.className = "tool-card";
  const label = ({ read_file:"Read", edit_file:"Edit", write_file:"Write", list_dir:"List", search_code:"Search", run_command:"Bash" }[t.name] || t.name);
  card.innerHTML = `
    <div class="tool-head">
      <div class="tool-title"><span class="bullet">●</span><strong>${esc(label)}</strong><span class="tool-brief">(${esc(t.brief || "")})</span></div>
      <span class="muted">${t.elapsed_s !== undefined ? t.elapsed_s.toFixed(1)+"s" : ""}</span>
    </div>
    <div class="tool-summary ${t.ok ? "" : "tool-err"}">⎿ ${esc(t.summary || "")}</div>
  `;
  if (t.diff && t.diff.lines && t.diff.lines.length) {
    const db = document.createElement("div");
    db.className = "diff-box";
    for (const ln of t.diff.lines) {
      const sign = ln.kind === "add" ? "+" : ln.kind === "del" ? "-" : " ";
      const r = document.createElement("div");
      r.className = `diff-line ${ln.kind}`;
      r.innerHTML = `<span class="diff-num">${ln.num || ""} ${sign}</span><span>${highlightCode(ln.text)}</span>`;
      db.appendChild(r);
    }
    card.appendChild(db);
  } else if (t.raw) {
    const pre = document.createElement("pre");
    pre.className = "tool-raw";
    pre.textContent = t.raw;
    card.appendChild(pre);
    card.querySelector(".tool-head").onclick = () => card.classList.toggle("open");
  }
  return card;
}

async function runLocalSlash(text) {
  const low = text.toLowerCase();
  if (low === "/r" || low === "/reset") { await api("/api/reset", {}); await loadState(); return true; }
  if (low === "/p" || low === "/profile") { openSettings("profiles"); return true; }
  if (low === "/ms" || low === "/model") { openSettings("providers"); return true; }
  if (low === "/tk" || low === "/think") { await api("/api/settings/ui", { show_thinking: STATE?.ui_prefs?.show_thinking === false }); await loadState(); return true; }
  if (low === "/s" || low === "/skill") { openSettings("skills"); return true; }
  if (low === "/export") {
    const res = await api("/api/export", {});
    $("sidebar-right").classList.remove("hidden");
    setRsNote(`Saved ${res.path}`);
    return true;
  }
  if (low.startsWith("/s ") || low.startsWith("/skill ")) {
    const arg = text.split(/\s+/)[1]?.toLowerCase() || "";
    const active = STATE?.active_project?.active_skills || [];
    if (arg === "clear" || arg === "none" || arg === "reset") {
      const m = loadPinnedMap(); delete m[STATE.active_project.name]; savePinnedMap(m);
      for (const s of [...active]) await api("/api/settings/profile", { skill_toggle: s });
      await loadState();
    } else if ((STATE?.skills || []).includes(arg)) {
      await api("/api/settings/profile", { skill_toggle: arg }); await loadState();
    }
    return true;
  }
  return false;
}

let pendingImages = [];

function updateSendReady() {
  const ready = ($("msg-input")?.value.trim().length > 0) || pendingImages.length > 0;
  $("btn-send")?.classList.toggle("ready", ready);
}

function renderImgStrip() {
  const strip = $("img-strip");
  strip.innerHTML = "";
  strip.classList.toggle("open", pendingImages.length > 0);
  pendingImages.forEach((src, i) => {
    const box = document.createElement("div");
    box.className = "img-thumb";
    box.innerHTML = `<img src="${src}" /><button class="img-rm" title="Remove">✕</button>`;
    box.querySelector("button").onclick = () => { pendingImages.splice(i, 1); renderImgStrip(); };
    strip.appendChild(box);
  });
  updateSendReady();
}

function addImageFiles(files) {
  for (const f of Array.from(files || [])) {
    if (!f.type.startsWith("image/") || pendingImages.length >= 4) continue;
    const rd = new FileReader();
    rd.onload = () => {
      if (typeof rd.result === "string" && pendingImages.length < 4) {
        pendingImages.push(rd.result);
        renderImgStrip();
      }
    };
    rd.readAsDataURL(f);
  }
}

async function sendMessage(overrideText, overrideImgs) {
  if (STREAMING) return;
  const text = overrideText !== undefined ? overrideText : $("msg-input").value.trim();
  const imgs = overrideText !== undefined ? (overrideImgs || []) : [...pendingImages];
  if (!text && !imgs.length) return;
  if (overrideText === undefined) {
    $("msg-input").value = "";
    resizeInput();
    pendingImages = [];
    renderImgStrip();
  }
  closeAc();
  if (!imgs.length && text.startsWith("/") && await runLocalSlash(text)) return;

  lastSentPayload = { text, imgs };
  STREAMING = true;
  $("btn-send").style.display = "none";
  $("btn-stop").style.display = "inline-flex";

  const stream = $("stream");
  if ($("empty-state")) stream.innerHTML = "";
  let wrap = stream.querySelector(".turn-wrap");
  if (!wrap) { wrap = document.createElement("div"); wrap.className = "turn-wrap"; stream.appendChild(wrap); }

  wrap.appendChild(buildUserEl(text, imgs));

  let curThink = "", curAns = "";
  let liveAsst = document.createElement("div");
  liveAsst.className = "msg-assistant";
  wrap.appendChild(liveAsst);
  stream.scrollTop = stream.scrollHeight;

  let liveStep = 1, needNextStep = false;
  let thinkDet = null, thinkCount = null, thinkBody = null, thinkT0 = 0;
  let ansRow = null, ansBody = null;
  const resetLiveNodes = () => {
    curThink = ""; curAns = ""; thinkT0 = 0; needNextStep = true;
    thinkDet = thinkCount = thinkBody = ansRow = ansBody = null;
    liveAsst = document.createElement("div");
    liveAsst.className = "msg-assistant";
    wrap.appendChild(liveAsst);
  };
  const scrollNearBottom = () => {
    if (stream.scrollHeight - stream.scrollTop - stream.clientHeight < 96) {
      stream.scrollTop = stream.scrollHeight;
    }
  };
  const updateLive = (isThink) => {
    if (needNextStep) { liveStep += 1; needNextStep = false; }
    if (isThink) {
      if (!thinkT0) thinkT0 = performance.now();
      if (!thinkDet) {
        thinkDet = document.createElement("details");
        thinkDet.className = "think-box";
        if (STATE?.ui_prefs?.show_thinking !== false) thinkDet.open = true;
        thinkDet.innerHTML = `<summary><span class="think-step">${esc(stepTitle(liveStep))}</span><span class="think-meta"></span>${THINK_CHEV}</summary><div class="think-body">${THINK_STAR}<span class="think-text"></span></div>`;
        thinkCount = thinkDet.querySelector(".think-meta");
        thinkBody = thinkDet.querySelector(".think-text");
        liveAsst.prepend(thinkDet);
      }
      thinkCount.textContent = thinkMeta(curThink.length, (performance.now() - thinkT0) / 1000);
      thinkBody.textContent = curThink;
    } else {
      if (!ansRow) {
        ansRow = document.createElement("div");
        ansRow.className = "ans-row";
        ansRow.innerHTML = `<span class="bullet">●</span><div class="ans-body"></div>`;
        ansBody = ansRow.querySelector(".ans-body");
        liveAsst.appendChild(ansRow);
      }
      ansBody.innerHTML = renderMarkdown(curAns);
    }
    scrollNearBottom();
  };

  let chatErr = null, errRolledBack = false;
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, images: imgs }),
    });
    if (!resp.ok) throw new Error(await resp.text() || resp.statusText);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const rawEv = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let evName = "message", evData = "";
        for (const line of rawEv.split("\n")) {
          if (line.startsWith("event:")) evName = line.slice(6).trim();
          else if (line.startsWith("data:")) evData += line.slice(5).trim();
        }
        if (!evData) continue;
        const d = JSON.parse(evData);
        if (evName === "thinking" && d.text) { curThink += d.text; updateLive(true); }
        else if (evName === "chunk" && d.text) { curAns += d.text; updateLive(false); }
        else if (evName === "tool_result") {
          wrap.appendChild(buildToolCard(d));
          resetLiveNodes();
          scrollNearBottom();
        } else if (evName === "permission") {
          const gc = document.createElement("div");
          gc.className = "gate-card";
          gc.innerHTML = `<div class="gate-title">⚠ Security Gate: ${esc(d.title)}</div><div class="gate-cmd">${esc(d.detail)}</div><div class="gate-actions"><button class="btn btn-sm btn-primary">Allow once</button><button class="btn btn-sm btn-danger">Deny</button></div>`;
          const [allowBtn, denyBtn] = gc.querySelectorAll("button");
          const resolvePerm = async (allow) => {
            allowBtn.disabled = denyBtn.disabled = true;
            await api("/api/authorize", { req_id: d.req_id, allow });
            gc.innerHTML = `<div class="muted">${allow ? "✓ Authorized once" : "✗ Denied"}: ${esc(d.title)}</div>`;
          };
          allowBtn.onclick = () => resolvePerm(true);
          denyBtn.onclick = () => resolvePerm(false);
          wrap.appendChild(gc);
          stream.scrollTop = stream.scrollHeight;
        } else if (evName === "error") {
          chatErr = d.message;
          errRolledBack = !!d.rolled_back;
        }
      }
    }
  } catch (err) {
    chatErr = err.message;
  } finally {
    STREAMING = false;
    $("btn-send").style.display = "inline-flex";
    $("btn-stop").style.display = "none";
    await loadState();
    if (chatErr) {
      if (errRolledBack) {
        if ($("empty-state")) stream.innerHTML = "";
        let w = stream.querySelector(".turn-wrap");
        if (!w) { w = document.createElement("div"); w.className = "turn-wrap"; stream.appendChild(w); }
        w.appendChild(buildUserEl(text, imgs));
      }
      const ec = document.createElement("div");
      ec.className = "err-card";
      ec.innerHTML = `<div class="err-msg">⚠ ${esc(chatErr)}</div><div class="err-acts"><button class="btn btn-sm">Try again</button></div>`;
      ec.querySelector("button").onclick = () => {
        if (lastSentPayload) sendMessage(lastSentPayload.text, lastSentPayload.imgs);
      };
      stream.appendChild(ec);
      stream.scrollTop = stream.scrollHeight;
    }
  }
}

function renderModalTab() {
  document.querySelectorAll(".nav-btn").forEach(x => x.classList.toggle("active", x.dataset.tab === ACTIVE_TAB));
  const pane = $("modal-pane");
  pane.innerHTML = "";
  if (ACTIVE_TAB === "providers") {
    pane.innerHTML = `<div style="font-weight:600">Providers & Runtime Governors</div><div class="muted">Click a configured .env slot to activate, or disable all to use Local :8080. API keys stay strictly server-side.</div>`;
    for (const s of STATE.providers) {
      const row = document.createElement("div");
      row.className = "setting-row" + (s.is_active ? " active-slot" : "");
      row.innerHTML = `<div><strong>${esc(s.name)}</strong><div class="muted">${esc(s.model)}</div></div><button class="btn btn-sm ${s.is_active ? "btn-primary" : ""}">${s.is_active ? "Active (Disable)" : "Activate"}</button>`;
      row.querySelector("button").onclick = async () => { await api("/api/settings/provider", { toggle_slot: s.id }); await loadState(); };
      pane.appendChild(row);
    }
    const tokOpts = Array.from(new Set([4096,8192,16384,32768,65536,131072,1048576,STATE.provider.env_max_tokens])).filter(Boolean).sort((a,b)=>a-b);
    const rndOpts = Array.from(new Set([5,10,15,20,25,30,50,0,STATE.provider.max_rounds]))
      .filter(v => v !== null && v !== undefined)
      .sort((a,b) => a === 0 ? 1 : b === 0 ? -1 : a - b);
    const gov = document.createElement("div");
    gov.className = "setting-row";
    gov.innerHTML = `
      <div class="field" style="flex:1"><label class="muted">Context Budget (AI_MAX_TOKENS)</label>
        <select id="gov-tok">${tokOpts.map(v => `<option value="${v}" ${STATE.provider.env_max_tokens===v?"selected":""}>${v}</option>`).join("")}</select>
      </div>
      <div class="field" style="flex:1"><label class="muted">Max Steps (AI_MAX_AGENT_ROUNDS)</label>
        <select id="gov-rnd">${rndOpts.map(v => `<option value="${v}" ${STATE.provider.max_rounds===v?"selected":""}>${v === 0 ? "Unlimited" : `${v} steps`}</option>`).join("")}</select>
      </div>`;
    pane.appendChild(gov);
    $("gov-tok").onchange = async (e) => { await api("/api/settings/provider", { max_tokens: +e.target.value }); await loadState(); };
    $("gov-rnd").onchange = async (e) => { await api("/api/settings/provider", { max_rounds: +e.target.value }); await loadState(); };
  } else if (ACTIVE_TAB === "profiles") {
    const locked = !STATE.active_project.is_agent;
    pane.innerHTML = `<div style="font-weight:600">Workspace Profile</div><div class="muted">${locked ? "Chat mode is locked to the <code>chat</code> profile. Switch to an agent project to change profiles." : "Select which profile in <code>profiles/*.md</code> drives the active project."}</div>`;
    for (const prof of STATE.profiles) {
      const cur = STATE.active_project.profile_name === prof;
      const row = document.createElement("div");
      row.className = "setting-row" + (cur ? " active-slot" : "");
      row.innerHTML = `<div><strong>${esc(prof)}</strong></div><button class="btn btn-sm ${cur ? "btn-primary" : ""}" ${locked ? "disabled" : ""}>${cur ? "Active" : "Select"}</button>`;
      row.querySelector("button").onclick = async () => { await api("/api/settings/profile", { profile_name: prof }); await loadState(); };
      pane.appendChild(row);
    }
  } else if (ACTIVE_TAB === "skills") {
    const active = STATE.active_project.active_skills || [];
    pane.innerHTML = `<div><div style="font-weight:600">Skills (${active.length}/3 active)</div><div class="muted">Attached skills are injected into the system prompt for the next turn.</div></div><input class="skills-filter" id="modal-skills-filter" placeholder="Filter skills..." value="${esc(skillFilter)}" /><div id="modal-skills-list" style="display:flex;flex-direction:column;gap:8px;"></div>`;
    const drawSkillsList = () => {
      const list = $("modal-skills-list");
      const q = skillFilter.trim().toLowerCase();
      const filtered = (STATE.skills || []).filter((s) => !q || s.toLowerCase().includes(q));
      list.innerHTML = "";
      if (!filtered.length) { list.innerHTML = `<div class="muted">No matching skills in ~/.config/rs-agent/skills/</div>`; return; }
      for (const sk of filtered) {
        const on = active.includes(sk);
        const full = !on && active.length >= 3;
        const row = document.createElement("div");
        row.className = "setting-row" + (on ? " active-slot" : "");
        row.innerHTML = `<div><strong>${esc(sk)}</strong><div class="muted">~/.config/rs-agent/skills/${esc(sk)}.md</div></div><button class="switch ${on ? "on" : ""}" ${full ? "disabled" : ""}></button>`;
        row.querySelector("button").onclick = async () => { await api("/api/settings/profile", { skill_toggle: sk }); await loadState(); };
        list.appendChild(row);
      }
    };
    drawSkillsList();
    $("modal-skills-filter").oninput = (e) => { skillFilter = e.target.value; drawSkillsList(); };
  } else if (ACTIVE_TAB === "commands") {
    pane.innerHTML = `<div style="font-weight:600">Slash Commands</div><div class="muted">Type <code>/</code> in the composer or run an action below.</div>`;
    for (const c of SLASH_CMDS) {
      const row = document.createElement("div");
      row.className = "setting-row";
      row.innerHTML = `<div><strong style="font-family:var(--mono)">${esc(c.cmd)}</strong><div class="muted">${esc(c.desc)}</div></div><button class="btn btn-sm">Run</button>`;
      row.querySelector("button").onclick = async () => {
        $("modal-settings").classList.remove("open");
        if (c.cmd === "/task") $("btn-run-task").click();
        else await runLocalSlash(c.cmd);
      };
      pane.appendChild(row);
    }
  } else if (ACTIVE_TAB === "mcp") {
    pane.innerHTML = `<div style="font-weight:600">MCP Servers (plugins/mcp/servers.json)</div><div class="muted">Servers spawned over stdio by <code>src/mcp.rs</code> when attached to a profile.</div>`;
    for (const m of STATE.mcp_servers) {
      const row = document.createElement("div");
      row.className = "setting-row";
      row.innerHTML = `<div style="min-width:0"><strong>${esc(m.name)}</strong><div class="muted" style="font-family:var(--mono);overflow:hidden;text-overflow:ellipsis">${esc(m.command)} ${esc((m.args||[]).join(" "))}</div></div><button class="btn btn-sm">Inspect Tools</button>`;
      row.querySelector("button").onclick = async (e) => {
        e.target.textContent = "Probing...";
        try {
          const res = await api("/api/settings/mcp", { inspect: m.name });
          $("mf-title").textContent = `MCP: ${m.name} (${res.tools.length} tools)`;
          $("mf-body").textContent = res.tools.map(t => `• ${t.function.name} — ${t.function.description || ""}`).join("\n");
          $("modal-file").classList.add("open");
        } catch (err) { $("mf-title").textContent = "MCP Error"; $("mf-body").textContent = err.message; $("modal-file").classList.add("open"); }
        e.target.textContent = "Inspect Tools";
      };
      pane.appendChild(row);
    }
    const addBox = document.createElement("div");
    addBox.className = "setting-row";
    addBox.style.flexDirection = "column";
    addBox.style.alignItems = "stretch";
    addBox.innerHTML = `
      <strong>+ Add MCP Server</strong>
      <div style="display:flex;gap:8px;"><input id="mcp-name" placeholder="name (e.g. context7)" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px;" /><input id="mcp-cmd" placeholder="command (e.g. npx)" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px;" /></div>
      <div style="display:flex;gap:8px;"><input id="mcp-args" placeholder="args (space-separated)" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px;" /><button class="btn btn-primary btn-sm" id="btn-add-mcp">Add</button></div>`;
    pane.appendChild(addBox);
    $("btn-add-mcp").onclick = async () => {
      const name = $("mcp-name").value.trim(), command = $("mcp-cmd").value.trim(), args = $("mcp-args").value.trim().split(/\s+/).filter(Boolean);
      if (!name || !command) return;
      await api("/api/settings/mcp", { add: { name, command, args } });
      await loadState();
    };
  } else if (ACTIVE_TAB === "appearance") {
    const ap = getAppearance();
    pane.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-weight:600">Themes</div><div class="muted">Custom themes: <code>plugins/rs-rail/themes/*.json</code></div></div><button class="btn btn-sm" id="btn-reload-themes">Reload</button></div><div class="theme-grid" id="theme-grid"></div>`;
    $("btn-reload-themes").onclick = () => loadState();

    const grid = $("theme-grid");
    for (const t of allThemes()) {
      const card = document.createElement("button");
      card.className = "theme-card" + (ap.theme === t.id ? " active" : "");
      const tag = t.source === "live" ? "desktop" : (t.source === "custom" ? "custom" : t.mode);
      card.innerHTML = `<span class="theme-swatch" style="background:linear-gradient(135deg, ${esc(t.bg)} 50%, ${esc(t.accent)} 50%)"></span><span class="theme-meta"><span class="theme-name">${esc(t.name)}</span><span class="theme-tag">${esc(tag)}</span></span>`;
      card.onclick = () => { applyAppearance({ theme: t.id }); renderModalTab(); };
      grid.appendChild(card);
    }

    const uiRow = document.createElement("div");
    uiRow.className = "setting-row";
    uiRow.innerHTML = `<div><strong>Interface Font</strong><div class="muted">Labels, headings, and chat prose</div></div>
      <select id="ap-ui-font" class="comp-select">
        <option value="JetBrains Mono" ${ap.uiFont==="JetBrains Mono"?"selected":""}>JetBrains Mono</option>
        <option value="Geist" ${ap.uiFont==="Geist"?"selected":""}>Geist</option>
        <option value="System" ${ap.uiFont==="System"?"selected":""}>System Sans</option>
      </select>`;
    pane.appendChild(uiRow);
    $("ap-ui-font").onchange = (e) => applyAppearance({ uiFont: e.target.value });

    const codeRow = document.createElement("div");
    codeRow.className = "setting-row";
    codeRow.innerHTML = `<div><strong>Code Font &amp; Size</strong><div class="muted">Code blocks, diffs, thinking, and tools (12px = 9pt)</div></div>
      <div style="display:flex;gap:6px;align-items:center;">
        <select id="ap-code-font" class="comp-select">
          <option value="JetBrains Mono" ${ap.codeFont==="JetBrains Mono"?"selected":""}>JetBrains Mono</option>
          <option value="Fira Code" ${ap.codeFont==="Fira Code"?"selected":""}>Fira Code</option>
          <option value="System" ${ap.codeFont==="System"?"selected":""}>System Mono</option>
        </select>
        <select id="ap-code-size" class="comp-select">
          ${[11,12,13,14,15,16].map(n => `<option value="${n}" ${ap.codeSize===n?"selected":""}>${n}px</option>`).join("")}
        </select>
      </div>`;
    pane.appendChild(codeRow);
    $("ap-code-font").onchange = (e) => applyAppearance({ codeFont: e.target.value });
    $("ap-code-size").onchange = (e) => applyAppearance({ codeSize: +e.target.value });

    const ligRow = document.createElement("div");
    ligRow.className = "setting-row";
    ligRow.innerHTML = `<div><strong>Code Ligatures</strong><div class="muted">Render <code>=&gt;</code>, <code>!=</code>, <code>::</code> ligatures in monospace</div></div><button class="btn btn-sm">${ap.ligatures ? "On" : "Off"}</button>`;
    ligRow.querySelector("button").onclick = () => { applyAppearance({ ligatures: !getAppearance().ligatures }); renderModalTab(); };
    pane.appendChild(ligRow);


    const r = document.createElement("div");
    r.className = "setting-row";
    r.innerHTML = `<div><strong>Auto-Expand Thinking</strong><div class="muted">Synced with CLI <code>/tk</code> via state.json</div></div><button class="btn btn-sm">${STATE.ui_prefs.show_thinking !== false ? "On" : "Collapsed"}</button>`;
    r.querySelector("button").onclick = async () => { await api("/api/settings/ui", { show_thinking: STATE.ui_prefs.show_thinking === false }); await loadState(); };
    pane.appendChild(r);
  }
}

let acItems = [];
let acHl = 0;

function closeAc() {
  $("ac-pop").classList.remove("open");
  acItems = [];
}

function updateAutocomplete() {
  const val = $("msg-input").value;
  if (!val.startsWith("/") || /\s/.test(val)) { closeAc(); return; }
  const q = val.slice(1).toLowerCase();
  acItems = SLASH_CMDS.filter((c) => c.cmd.slice(1).startsWith(q));
  if (!acItems.length) { closeAc(); return; }
  if (acHl >= acItems.length) acHl = 0;

  const pop = $("ac-pop");
  pop.innerHTML = "";
  acItems.forEach((it, idx) => {
    const btn = document.createElement("button");
    btn.className = "ac-item" + (idx === acHl ? " hl" : "");
    btn.innerHTML = `<div class="ac-left"><span class="ac-key">${esc(it.cmd)}</span><span class="ac-desc">${esc(it.desc)}</span></div>`;
    btn.onmousedown = (e) => { e.preventDefault(); pickAcItem(idx); };
    pop.appendChild(btn);
  });
  pop.classList.add("open");
}

async function pickAcItem(idx) {
  const it = acItems[idx];
  if (!it) return;
  const inp = $("msg-input");
  closeAc();
  if (it.cmd === "/task") {
    if (STATE?.active_project?.task_md) { inp.value = ""; await sendMessage("/task"); }
    else { inp.value = "/task "; inp.focus(); }
    return;
  }
  inp.value = "";
  await runLocalSlash(it.cmd);
}

const toggleLeft = () => {
  const hidden = $("sidebar-left").classList.toggle("hidden");
  localStorage.setItem("rs_rail_left_hidden", hidden ? "1" : "0");
};
$("btn-toggle-proj").onclick = toggleLeft;
if (localStorage.getItem("rs_rail_left_hidden") === "1") $("sidebar-left").classList.add("hidden");
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    $("modal-settings").classList.remove("open");
    $("modal-new-proj").classList.remove("open");
    $("modal-file").classList.remove("open");
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") { e.preventDefault(); toggleLeft(); }
  if ((e.ctrlKey || e.metaKey) && /^[1-9]$/.test(e.key) && STATE?.projects?.[+e.key - 1]) { e.preventDefault(); loadState(STATE.projects[+e.key - 1].name); }
});

$("btn-img").onclick = () => $("img-file").click();
$("img-file").onchange = (e) => { addImageFiles(e.target.files); e.target.value = ""; };
$("msg-input").addEventListener("paste", (e) => {
  if (STATE?.provider?.is_local) return;
  const imgs = Array.from(e.clipboardData?.items || []).filter(i => i.type.startsWith("image/")).map(i => i.getAsFile()).filter(Boolean);
  if (imgs.length) { e.preventDefault(); addImageFiles(imgs); }
});
$("btn-send").onclick = () => sendMessage();
$("btn-stop").onclick = () => api("/api/stop", {});
function disarmReset() {
  const b = $("btn-reset");
  if (!b) return;
  clearTimeout(b._t);
  delete b.dataset.arm;
  b.classList.remove("btn-danger");
  b.textContent = "Reset";
}
$("btn-reset").onclick = async () => {
  const b = $("btn-reset");
  if (!b.dataset.arm) {
    b.dataset.arm = "1";
    b.classList.add("btn-danger");
    b.textContent = "sure?";
    b._t = setTimeout(disarmReset, 2200);
    return;
  }
  disarmReset();
  if (STREAMING) await api("/api/stop", {});
  await api("/api/reset", {});
  await loadState();
};
$("btn-toggle-task").onclick = async () => {
  const hidden = $("sidebar-right").classList.toggle("hidden");
  await api("/api/settings/ui", { show_right_panel: !hidden });
};
$("rs-tab-task").onclick = () => {
  $("rs-tab-task").classList.add("active"); $("rs-tab-mem").classList.remove("active");
  $("rs-pane-task").classList.add("open"); $("rs-pane-mem").classList.remove("open");
  $("btn-run-task").style.display = "inline-flex"; $("btn-save-mem").style.display = "none";
};
$("rs-tab-mem").onclick = () => {
  $("rs-tab-mem").classList.add("active"); $("rs-tab-task").classList.remove("active");
  $("rs-pane-mem").classList.add("open"); $("rs-pane-task").classList.remove("open");
  $("btn-save-mem").style.display = "inline-flex"; $("btn-run-task").style.display = "none";
};
function resizeInput() {
  const el = $("msg-input");
  el.style.height = "auto";
  el.style.height = el.value ? `${Math.min(Math.max(el.scrollHeight, 36), 180)}px` : "";
}

$("btn-run-task").onclick = () => {
  const ap = STATE?.active_project;
  if (!ap?.is_agent) return;
  if (!ap.task_md) {
    const inp = $("msg-input");
    if (!inp.value.startsWith("/task")) inp.value = "/task " + inp.value;
    resizeInput();
    updateSendReady();
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    return;
  }
  sendMessage("/task");
};
$("btn-save-mem").onclick = async () => {
  try {
    await api("/api/memory", { content: $("mem-input").value });
    setRsNote("Memory saved ✓");
    await loadState();
  } catch (err) { setRsNote(err.message); }
};
$("btn-export-md").onclick = async () => {
  try {
    const res = await api("/api/export", {});
    setRsNote(`Saved ${res.path}`);
  } catch (err) { setRsNote(err.message); }
};
$("btn-settings").onclick = () => openSettings();
$("btn-profiles-nav").onclick = $("tb-profile").onclick = () => openSettings("profiles");
$("btn-close-app").onclick = async () => {
  try { await api("/api/shutdown", {}); } catch {}
  window.close();
  document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);">RS Rail closed.</div>`;
};
$("btn-model-pill").onclick = () => openSettings("providers");
$("btn-close-settings").onclick = () => $("modal-settings").classList.remove("open");
$("btn-close-file").onclick = () => $("modal-file").classList.remove("open");
document.querySelectorAll(".nav-btn").forEach(b => b.onclick = () => {
  ACTIVE_TAB = b.dataset.tab; renderModalTab();
});

$("sel-reasoning").onchange = async (e) => { await api("/api/settings/profile", { reasoning: e.target.value }); await loadState(); };
$("msg-input").addEventListener("input", () => { acHl = 0; resizeInput(); updateSendReady(); updateAutocomplete(); });
$("msg-input").addEventListener("click", () => updateAutocomplete());
document.addEventListener("click", (e) => { if (!e.target.closest(".composer")) closeAc(); });
$("msg-input").addEventListener("keydown", (e) => {
  if ($("ac-pop").classList.contains("open") && acItems.length) {
    if (e.key === "ArrowDown") { e.preventDefault(); acHl = (acHl + 1) % acItems.length; updateAutocomplete(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); acHl = (acHl + acItems.length - 1) % acItems.length; updateAutocomplete(); return; }
    if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) { e.preventDefault(); pickAcItem(acHl); return; }
    if (e.key === "Escape") { e.preventDefault(); closeAc(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

$("btn-new-proj").onclick = () => {
  $("np-err").textContent = "";
  const sel = $("np-prof");
  sel.innerHTML = (STATE?.profiles || ["chat"]).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
  $("modal-new-proj").classList.add("open");
  $("np-name").focus();
};
$("np-name").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); $("btn-create-np").click(); } };
$("btn-close-new-proj").onclick = $("btn-cancel-np").onclick = () => $("modal-new-proj").classList.remove("open");
$("btn-create-np").onclick = async () => {
  const name = $("np-name").value.trim(), profile = $("np-prof").value;
  if (!name) return;
  try {
    const created = await api("/api/project/create", { name, profile });
    $("np-name").value = "";
    $("modal-new-proj").classList.remove("open");
    await loadState(created.name);
  } catch (err) {
    $("np-err").textContent = err.message;
  }
};

const params = new URLSearchParams(location.search);
const liveEs = new EventSource("/api/live");
window.addEventListener("pagehide", () => liveEs.close());
loadState(params.get("project") || "");

let lastThemeSig = "", lastThemeSync = 0;
async function syncThemes(force) {
  if (document.hidden || !STATE) return;
  const id = getAppearance().theme;
  if (!force && id !== "omarchy" && !id.startsWith("custom:")) return;
  const now = Date.now();
  if (!force && now - lastThemeSync < 1500) return;
  lastThemeSync = now;
  try {
    const res = await api("/api/themes");
    const sig = JSON.stringify(res.themes || []);
    if (sig !== lastThemeSig) {
      lastThemeSig = sig;
      STATE.themes = res.themes || [];
      applyAppearance();
      if ($("modal-settings").classList.contains("open") && ACTIVE_TAB === "appearance") renderModalTab();
    }
  } catch {}
}
window.addEventListener("focus", () => syncThemes(false));
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncThemes(false); });
</script>
<div class="proj-hover" id="proj-hover"></div>
</body>
