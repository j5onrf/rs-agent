    synRow.className = "setting-row";
    synRow.innerHTML = `<div><strong>Syntax Highlighting</strong><div class="muted">Colorize keywords, strings, numbers, and comments in code</div></div>
      <div style="display:flex;gap:4px;" class="rs-tabs">
        <button class="rs-tab ${synOn ? "active" : ""}" id="btn-syn-on">On</button>
        <button class="rs-tab ${!synOn ? "active" : ""}" id="btn-syn-off">Off</button>
      </div>`;
    pane.appendChild(synRow);
    $("btn-syn-on").onclick = () => { applyAppearance({ syntaxHighlight: true }); renderModalTab(); };
    $("btn-syn-off").onclick = () => { applyAppearance({ syntaxHighlight: false }); renderModalTab(); };

    const barRow = document.createElement("div");
    barRow.className = "setting-row";
    const isPills = ap.promptBar !== "ghost";
    barRow.innerHTML = `<div><strong>Composer Style</strong><div class="muted">Unified micro-pills (B) or borderless ghost controls (A)</div></div>
      <div style="display:flex;gap:4px;" class="rs-tabs">
        <button class="rs-tab ${isPills ? "active" : ""}" id="btn-pbar-pills">Pills</button>
        <button class="rs-tab ${!isPills ? "active" : ""}" id="btn-pbar-ghost">Ghost</button>
      </div>`;
    pane.appendChild(barRow);
    $("btn-pbar-pills").onclick = () => { applyAppearance({ promptBar: "pills" }); renderModalTab(); };
    $("btn-pbar-ghost").onclick = () => { applyAppearance({ promptBar: "ghost" }); renderModalTab(); };

    const szRow = document.createElement("div");
    szRow.className = "setting-row";
    const isCompact = ap.composerSize === "compact";
    szRow.innerHTML = `<div><strong>Composer Size</strong><div class="muted">Height and density of the message box</div></div>
      <div style="display:flex;gap:4px;" class="rs-tabs">
        <button class="rs-tab ${!isCompact ? "active" : ""}" id="btn-csz-default">Default</button>
        <button class="rs-tab ${isCompact ? "active" : ""}" id="btn-csz-compact">Compact</button>
      </div>`;
    pane.appendChild(szRow);
    $("btn-csz-default").onclick = () => { applyAppearance({ composerSize: "default" }); renderModalTab(); };
    $("btn-csz-compact").onclick = () => { applyAppearance({ composerSize: "compact" }); renderModalTab(); };

    const glowRow = document.createElement("div");
    glowRow.className = "setting-row";
    const glowOn = !!ap.ambientLight;
    glowRow.innerHTML = `<div><strong>Composer Ambient Light</strong><div class="muted">Subtle theme-reactive underglow behind the composer</div></div>
      <div style="display:flex;gap:4px;" class="rs-tabs">
        <button class="rs-tab ${!glowOn ? "active" : ""}" id="btn-glow-off">Off</button>
        <button class="rs-tab ${glowOn ? "active" : ""}" id="btn-glow-on">On</button>
      </div>`;
    pane.appendChild(glowRow);
    $("btn-glow-off").onclick = () => { applyAppearance({ ambientLight: false }); renderModalTab(); };
    $("btn-glow-on").onclick = () => { applyAppearance({ ambientLight: true }); renderModalTab(); };

    const botRow = document.createElement("div");
    botRow.className = "setting-row";
    const botsOn = ap.microBots !== false;
    botRow.innerHTML = `<div><strong>Project Badges</strong><div class="muted">Deterministic micro-bot icons or 2-letter monograms</div></div>
      <div style="display:flex;gap:4px;" class="rs-tabs">
        <button class="rs-tab ${botsOn ? "active" : ""}" id="btn-bots-on">Micro-Bots</button>
        <button class="rs-tab ${!botsOn ? "active" : ""}" id="btn-bots-off">Letters</button>
      </div>`;
    pane.appendChild(botRow);
    $("btn-bots-on").onclick = () => { applyAppearance({ microBots: true }); renderAll(); };
    $("btn-bots-off").onclick = () => { applyAppearance({ microBots: false }); renderAll(); };

    const r = document.createElement("div");
    r.className = "setting-row";
    r.innerHTML = `<div><strong>Auto-Expand Steps</strong><div class="muted">Expand reasoning steps by default · Synced with CLI <code>/tk</code> via state.json</div></div><button class="btn btn-sm">${STATE.ui_prefs.show_thinking !== false ? "Expanded" : "Collapsed"}</button>`;
    r.querySelector("button").onclick = async () => { await api("/api/settings/ui", { show_thinking: STATE.ui_prefs.show_thinking === false }); await loadState(); };
    pane.appendChild(r);
  }
}

let acItems = [];
let acHl = 0;

function closeAc() {
  $("ac-pop").classList.remove("open");
  acItems = [];
}

function updateAutocomplete() {
  const val = $("msg-input").value;
  if (!val.startsWith("/") || /\s/.test(val)) { closeAc(); return; }
  const q = val.slice(1).toLowerCase();
  acItems = SLASH_CMDS.filter((c) => c.cmd.slice(1).startsWith(q));
  if (!acItems.length) { closeAc(); return; }
  closeReasoningPop();
  if (acHl >= acItems.length) acHl = 0;

  const pop = $("ac-pop");
  pop.innerHTML = "";
  acItems.forEach((it, idx) => {
    const btn = document.createElement("button");
    btn.className = "ac-item" + (idx === acHl ? " hl" : "");
    btn.innerHTML = `<div class="ac-left"><span class="ac-key">${esc(it.cmd)}</span><span class="ac-desc">${esc(it.desc)}</span></div>`;
    btn.onmousedown = (e) => { e.preventDefault(); pickAcItem(idx); };
    pop.appendChild(btn);
  });
  pop.classList.add("open");
}

async function pickAcItem(idx) {
  const it = acItems[idx];
  if (!it) return;
  const inp = $("msg-input");
  closeAc();
  if (it.cmd === "/task") {
    if (STATE?.active_project?.task_md) { inp.value = ""; await sendMessage("/task"); }
    else { inp.value = "/task "; inp.focus(); }
    return;
  }
  inp.value = "";
  await runLocalSlash(it.cmd);
}

const toggleLeft = () => {
  const hidden = $("sidebar-left").classList.toggle("hidden");
  localStorage.setItem("rs_rail_left_hidden", hidden ? "1" : "0");
};
$("btn-toggle-proj").onclick = toggleLeft;
if (localStorage.getItem("rs_rail_left_hidden") === "1") $("sidebar-left").classList.add("hidden");
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeReasoningPop();
    closeAc();
    $("modal-settings").classList.remove("open");
    $("modal-new-proj").classList.remove("open");
    $("modal-file").classList.remove("open");
  }
  if ((e.ctrlKey || e.metaKey) && e.key === ",") { e.preventDefault(); openSettings(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") { e.preventDefault(); toggleLeft(); }
  if ((e.ctrlKey || e.metaKey) && /^[1-9]$/.test(e.key) && STATE?.projects) {
    const hs = new Set(STATE.ui_prefs?.hidden_projects || []);
    const vis = STATE.projects.filter((p) => !hs.has(p.name));
    if (vis[+e.key - 1]) { e.preventDefault(); loadState(vis[+e.key - 1].name); }
  }
});

$("btn-img").onclick = () => $("img-file").click();
$("img-file").onchange = (e) => { addImageFiles(e.target.files); e.target.value = ""; };
$("msg-input").addEventListener("paste", (e) => {
  if (STATE?.provider?.is_local) return;
  const imgs = Array.from(e.clipboardData?.items || []).filter(i => i.type.startsWith("image/")).map(i => i.getAsFile()).filter(Boolean);
  if (imgs.length) { e.preventDefault(); addImageFiles(imgs); }
});
$("btn-send").onclick = () => sendMessage();
$("btn-stop").onclick = () => api("/api/stop", {});
const RESET_SVG = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9L2.5 5.7"/><path d="M2.5 2.5v3.2h3.2"/></svg>`;
function disarmReset() {
  const b = $("btn-reset");
  if (!b) return;
  clearTimeout(b._t);
  delete b.dataset.arm;
  b.classList.remove("btn-danger");
  b.innerHTML = RESET_SVG;
}
$("btn-reset").onclick = async () => {
  const b = $("btn-reset");
  if (!b.dataset.arm) {
    b.dataset.arm = "1";
    b.classList.add("btn-danger");
    b.textContent = "sure?";
    b._t = setTimeout(disarmReset, 2200);
    return;
  }
  disarmReset();
  if (STREAMING) await api("/api/stop", {});
  await api("/api/reset", {});
  await loadState();
};
$("btn-toggle-task").onclick = async () => {
  const hidden = $("sidebar-right").classList.toggle("hidden");
  await api("/api/settings/ui", { show_right_panel: !hidden });
};
$("rs-tab-task").onclick = () => {
  $("rs-tab-task").classList.add("active"); $("rs-tab-mem").classList.remove("active");
  $("rs-pane-task").classList.add("open"); $("rs-pane-mem").classList.remove("open");
  $("btn-run-task").style.display = "inline-flex"; $("btn-save-mem").style.display = "none";
};
$("rs-tab-mem").onclick = () => {
  $("rs-tab-mem").classList.add("active"); $("rs-tab-task").classList.remove("active");
  $("rs-pane-mem").classList.add("open"); $("rs-pane-task").classList.remove("open");
  $("btn-save-mem").style.display = "inline-flex"; $("btn-run-task").style.display = "none";
};
function resizeInput() {
  const el = document.getElementById("msg-input");
  if (!el) return;
  const minH = getAppearance().composerSize === "compact" ? 22 : 36;
  el.style.height = "auto";
  el.style.height = el.value ? `${Math.min(Math.max(el.scrollHeight, minH), 180)}px` : "";
}

$("btn-run-task").onclick = () => {
  const ap = STATE?.active_project;
  if (!ap?.is_agent) return;
  if (!ap.task_md) {
    const inp = $("msg-input");
    if (!inp.value.startsWith("/task")) inp.value = "/task " + inp.value;
    resizeInput();
    updateSendReady();
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    return;
  }
  sendMessage("/task");
};
$("btn-save-mem").onclick = async () => {
  try {
    await api("/api/memory", { content: $("mem-input").value });
    setRsNote("Memory saved ✓");
    await loadState();
  } catch (err) { setRsNote(err.message); }
};
$("btn-export-md").onclick = async () => {
  try {
    const res = await api("/api/export", {});
    setRsNote(`Saved ${res.path}`);
  } catch (err) { setRsNote(err.message); }
};
$("btn-settings").onclick = () => openSettings();
$("btn-brand-settings").onclick = () => openSettings();
$("btn-projects-nav").onclick = () => openSettings("projects");
$("btn-profiles-nav").onclick = () => openSettings("profiles");
$("btn-close-app").onclick = async () => {
  try { await api("/api/shutdown", {}); } catch {}
  window.close();
  document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);">RS Rail closed.</div>`;
};
$("btn-model-pill").onclick = () => openSettings("providers");
$("btn-close-settings").onclick = () => $("modal-settings").classList.remove("open");
$("btn-close-file").onclick = () => $("modal-file").classList.remove("open");
document.querySelectorAll(".modal-backdrop").forEach((m) => {
  let downOnBg = false;
  m.addEventListener("mousedown", (e) => { downOnBg = e.target === m; });
  m.addEventListener("click", (e) => { if (downOnBg && e.target === m) m.classList.remove("open"); downOnBg = false; });
});
document.querySelectorAll(".nav-btn").forEach(b => b.onclick = () => {
  ACTIVE_TAB = b.dataset.tab; noctaliaBrowse = false; renderModalTab();
});

$("btn-reasoning-pill").onclick = (e) => {
  e.stopPropagation();
  closeAc();
  const isOpen = $("pop-reasoning").classList.toggle("open");
  $("btn-reasoning-pill").classList.toggle("open", isOpen);
  $("btn-reasoning-pill").setAttribute("aria-expanded", String(isOpen));
};
$("msg-input").addEventListener("input", () => { acHl = 0; resizeInput(); updateSendReady(); updateAutocomplete(); });
$("msg-input").addEventListener("click", () => updateAutocomplete());
document.addEventListener("click", (e) => {
  if (!e.target.closest(".composer")) closeAc();
  if (!e.target.closest(".pop-wrap")) closeReasoningPop();
});
$("msg-input").addEventListener("keydown", (e) => {
  if ($("ac-pop").classList.contains("open") && acItems.length) {
    if (e.key === "ArrowDown") { e.preventDefault(); acHl = (acHl + 1) % acItems.length; updateAutocomplete(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); acHl = (acHl + acItems.length - 1) % acItems.length; updateAutocomplete(); return; }
    if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) { e.preventDefault(); pickAcItem(acHl); return; }
    if (e.key === "Escape") { e.preventDefault(); closeAc(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

$("btn-new-proj").onclick = () => {
  $("np-err").textContent = "";
  const sel = $("np-prof");
  sel.innerHTML = (STATE?.profiles || ["chat"]).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
  $("modal-new-proj").classList.add("open");
  $("np-name").focus();
};
$("np-name").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); $("btn-create-np").click(); } };
$("btn-close-new-proj").onclick = $("btn-cancel-np").onclick = () => $("modal-new-proj").classList.remove("open");
$("btn-create-np").onclick = async () => {
  const name = $("np-name").value.trim(), profile = $("np-prof").value;
  if (!name) return;
  try {
    const created = await api("/api/project/create", { name, profile });
    $("np-name").value = "";
    $("modal-new-proj").classList.remove("open");
    await loadState(created.name);
  } catch (err) {
    $("np-err").textContent = err.message;
  }
};

const params = new URLSearchParams(location.search);
const liveEs = new EventSource("/api/live");
window.addEventListener("pagehide", () => liveEs.close());
loadState(params.get("project") || "");

let lastThemeSig = "", lastThemeSync = 0;
async function syncThemes(force) {
  if (document.hidden || !STATE) return;
  const id = getAppearance().theme;
  if (!force && id !== "omarchy" && id !== "noctalia" && !id.startsWith("custom:")) return;
  const now = Date.now();
  if (!force && now - lastThemeSync < 1500) return;
  lastThemeSync = now;
  try {
    const res = await api("/api/themes");
    const sig = JSON.stringify(res.themes || []);
    if (sig !== lastThemeSig) {
      lastThemeSig = sig;
      STATE.themes = res.themes || [];
      applyAppearance();
      if ($("modal-settings").classList.contains("open") && ACTIVE_TAB === "appearance") renderModalTab();
    }
  } catch {}
}
window.addEventListener("focus", () => syncThemes(false));
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncThemes(false); });
</script>
<div class="proj-hover" id="proj-hover"></div>
</body>
