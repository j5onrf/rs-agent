<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<meta name="darkreader-lock" />
<title>RS Rail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fira+Code:wght@400;500;600&display=swap" />
<style>
  :root {
    --bg: #0c0c0e;
    --panel: #111215;
    --card: #18191d;
    --hover: #202228;
    --border: #26282e;
    --nav-bg: #0e0f12;
    --code-bg: #0f1014;
    --code-border: #26282e;
    --code-head: #111215;
    --text: #e5e7eb;
    --muted: #8e95a3;
    --dim: #5c6370;
    --accent: #22c55e;
    --accent-fg: #05140a;
    --accent-bg: rgba(34, 197, 94, 0.12);
    --user-bg: #16261d;
    --user-border: #244732;
    --user-text: #ecfdf5;
    --cyan: #38bdf8;
    --err-text: #fca5a5;
    --del-bg: rgba(239, 68, 68, 0.14);
    --del-text: #fca5a5;
    --add-bg: rgba(34, 197, 94, 0.14);
    --add-text: #86efac;
    --mono: "JetBrainsMono Nerd Font", "JetBrainsMono NF", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --sans: "JetBrainsMono Nerd Font", "JetBrainsMono NF", "JetBrains Mono", "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --warn-bg: rgba(245, 158, 11, 0.08);
    --warn-border: rgba(245, 158, 11, 0.45);
    --warn-text: #fcd34d;
    --syn-kw: #8ab4f8;
    --syn-str: #86efac;
    --syn-num: #fcd34d;
    --syn-cmt: #717885;
    --code-size: 12px;
    --ui-size: 13px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: var(--ui-size); overflow: hidden; font-synthesis: style; }
  body.theme-dark { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  button, input, select, textarea, [tabindex] { font: inherit; color: inherit; outline: none; }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.82; }
  #msg-input::placeholder { opacity: 0.48; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 2px; }
  button:disabled { opacity: 0.42; cursor: not-allowed; filter: none; }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* Topbar */
  .topbar { height: 40px; min-height: 40px; background: var(--topbar-bg, var(--panel)); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; gap: 10px; }
  .tb-left, .tb-right { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .brand { font-weight: 600; letter-spacing: .2px; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; padding: 0; color: var(--text); white-space: nowrap; background: var(--card); border: 1px solid var(--border); border-radius: 999px; cursor: default; }
  .brand.clickable { cursor: pointer; }
  .brand.clickable:hover { background: var(--hover); border-color: color-mix(in srgb, var(--accent) 30%, var(--border)); }
  .tele { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; user-select: none; }
  .tele strong { color: var(--text); font-weight: 500; }
  #tb-git-txt { display: inline-flex; align-items: center; gap: 1.5ch; }
  #tb-profile, #tb-git, #tb-stats, #tb-ctx { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; gap: 1.5ch; }
  .git-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
  .git-dot.dirty { background: var(--accent); }
  #tb-stats, #tb-ctx { position: relative; cursor: default; }
  .ctx-bar { display: block; width: 100%; height: 4px; background: color-mix(in srgb, var(--text) 14%, transparent); border-radius: 99px; overflow: hidden; }
  .ctx-fill { display: block; height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width .22s ease, background .2s; }
  .ctx-tip { position: absolute; right: 0; top: calc(100% + 8px); min-width: 170px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 11px; line-height: 1.4; color: var(--text); white-space: nowrap; box-shadow: 0 10px 24px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 5px; opacity: 0; pointer-events: none; transform: translateY(-2px); transition: opacity .12s ease, transform .12s ease; z-index: 40; }
  .ctx-tip .muted { font-size: 10.5px; }
  .ctx-tip:empty { display: none; }
  #tb-stats:hover .ctx-tip, #tb-ctx:hover .ctx-tip { opacity: 1; transform: translateY(0); }
  .btn { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; color: var(--text); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-danger { background: var(--del-bg); color: var(--err-text); border-color: rgba(239,68,68,.4); }
  .btn-sm { padding: 2px 8px; font-size: 11px; }
  .btn-icon { padding: 4px 6px; }
  .topbar .btn-icon { background: var(--card); border: 1px solid var(--border); border-radius: 999px; color: var(--muted); width: 26px; height: 26px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .topbar .btn-icon:hover { background: var(--hover); color: var(--text); border-color: color-mix(in srgb, var(--accent) 30%, var(--border)); }
  #btn-close-app { margin-left: 6px; transition: background .12s, color .12s, border-color .12s; }
  #btn-close-app:hover { color: var(--err-text); background: var(--del-bg); border-color: rgba(239,68,68,.4); }
  .btn-send-circle { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: background .12s, border-color .12s, color .12s, filter .12s; }
  .btn-send-circle:hover { background: var(--hover); color: var(--text); }
  .btn-send-circle.ready { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn-send-circle.ready:hover { filter: brightness(1.08); }
  .btn-send-circle.stop { background: var(--del-bg); border-color: rgba(239,68,68,.45); color: var(--err-text); }
  .btn-send-circle.stop:hover { filter: brightness(1.08); }
  .tok-k { color: var(--syn-kw); }
  .tok-s { color: var(--syn-str); }
  .tok-n { color: var(--syn-num); }
  .tok-c { color: var(--syn-cmt); font-style: italic; }

  /* Main 3-pane body */
  .main { flex: 1; display: flex; min-height: 0; }
  .sidebar-left { width: 230px; min-width: 200px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .sidebar-right { width: 230px; min-width: 200px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .sidebar-left.hidden, .sidebar-right.hidden { display: none; }
  .sec-head { padding: 10px 12px 6px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .rs-head { padding: 8px 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .rs-head .btn-icon { background: transparent; border-color: transparent; color: var(--muted); padding: 3px 5px; }
  .rs-head .btn-icon:hover { background: var(--hover); color: var(--text); }
  .rs-head .btn-icon.btn-danger { background: var(--del-bg); border-color: rgba(239,68,68,.4); color: var(--err-text); padding: 2px 7px; }
  .proj-list { flex: 1; overflow-y: auto; padding: 6px 6px 8px; }
  .sb-foot { padding: 6px 8px 8px; display: flex; align-items: center; }
  .sb-foot .btn-icon { background: transparent; border-color: transparent; color: var(--muted); opacity: 0; transition: opacity .15s, background .12s, color .12s; }
  .sidebar-left:hover .sb-foot .btn-icon, .sb-foot .btn-icon:focus-visible { opacity: 1; }
  .sb-foot .btn-icon:hover { opacity: 1; background: var(--hover); color: var(--text); }
  .proj-item { padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 3px; border: 1px solid transparent; }
  .proj-item:hover { background: var(--hover); }
  .proj-item.active { background: var(--active-bg, var(--user-bg)); border-color: var(--active-border, var(--user-border)); }
  .proj-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .proj-badge { width: 18px; height: 18px; border-radius: 4px; background: var(--card); border: 1px solid var(--border); color: var(--muted); font-size: 9.5px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; text-transform: uppercase; }
  .proj-badge.bot { border-radius: 999px; }
  .proj-item.active .proj-badge { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .proj-name { font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-meta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .proj-sub { font-size: 10px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.25; transition: color .12s; }
  .proj-item:hover .proj-sub, .proj-item.active .proj-sub { color: var(--muted); }
  .proj-item.active .proj-name { font-weight: 600; }
  .proj-acts { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .proj-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); opacity: 0; transition: opacity .12s; }
  .proj-dot.dirty { background: var(--accent); opacity: 0.9; }
  .proj-item:hover .proj-dot { opacity: 0.75; }
  .proj-item:hover .proj-dot.dirty { opacity: 1; }
  .proj-del { background: transparent; border: none; padding: 2px; border-radius: 4px; color: var(--muted); cursor: pointer; display: none; align-items: center; justify-content: center; line-height: 0; }
  .proj-item:hover .proj-del { display: inline-flex; }
  .proj-del:hover { color: var(--err-text); background: var(--del-bg); }
  .proj-hover { position: fixed; z-index: 60; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; min-width: 210px; max-width: 260px; box-shadow: 0 12px 30px rgba(0,0,0,.5); display: none; flex-direction: column; gap: 5px; font-size: 12px; }
  .proj-hover.open { display: flex; }
  .proj-tags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; }
  .proj-tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); }
  .proj-tag button, .lbl-chip button { background: transparent; border: none; padding: 0 1px; cursor: pointer; color: var(--dim); font-size: 10px; line-height: 1; }
  .proj-tag button:hover, .lbl-chip button:hover { color: var(--text); }
  .proj-ren { background: transparent; border: none; padding: 0 3px; cursor: pointer; color: var(--dim); font-size: 11px; line-height: 1; }
  .proj-ren:hover { color: var(--text); }
  .proj-tag button.arm, .lbl-chip button.arm { color: var(--err-text); background: var(--del-bg); border-radius: 4px; padding: 1px 4px; }
  .tag-inp { width: 96px; background: var(--bg); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--text); outline: none; }
  .lbl-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .lbl-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  .lbl-name { cursor: pointer; }
  .lbl-name:hover { color: var(--accent); }
  .ph-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; color: var(--text); }
  .ph-row { color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }

  /* Right Sidebar 2-Pane Split: Files + [Actions | Memory] */
  .rs-top { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--border); }
  .file-list { flex: 1; overflow-y: auto; padding: 2px 6px 8px; display: flex; flex-direction: column; gap: 1px; }
  .file-row { padding: 5px 8px; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--muted); cursor: pointer; }
  .file-row:hover { background: var(--hover); color: var(--text); }
  .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-del { background: transparent; border: none; color: var(--dim); cursor: pointer; font-size: 10px; padding: 1px 4px; border-radius: 4px; display: none; }
  .file-row:hover .file-del, .file-del.arm { display: inline-block; }
  .file-del.arm { color: var(--err-text); background: var(--del-bg); }
  .rs-bot { height: 42%; min-height: 175px; display: flex; flex-direction: column; flex-shrink: 0; }
  .rs-tabs { display: flex; gap: 4px; }
  .rs-tab { background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 2px 7px; font-size: 11px; color: var(--dim); cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 500; white-space: nowrap; }
  .rs-tab.active { background: var(--card); border-color: var(--border); color: var(--text); }
  .rs-pane { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .rs-pane.open { display: flex; }
  .act-list { flex: 1; overflow-y: auto; padding: 6px 8px; display: flex; flex-direction: column; gap: 5px; }
  .task-box { border: 1px solid var(--border); background: color-mix(in srgb, var(--accent) 7%, var(--card)); border-radius: 6px; padding: 7px 9px; display: flex; flex-direction: column; gap: 4px; }
  .task-box-head { display: flex; justify-content: space-between; align-items: center; }
  .task-box-title { font-size: 11px; font-weight: 600; color: var(--accent); }
  .task-box-body { font-size: 11px; color: var(--muted); line-height: 1.4; white-space: pre-wrap; max-height: 90px; overflow-y: auto; font-family: var(--mono); }
  .act-row { padding: 6px 8px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; border: 1px solid var(--border); background: var(--card); transition: background .12s, border-color .12s; min-width: 0; }
  .act-row:hover { background: var(--hover); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .act-cmd { font-family: var(--mono); font-size: 11.5px; color: var(--text); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; min-width: 0; flex: 0 1 auto; }
  .act-cmd svg { flex-shrink: 0; }
  .act-cmd > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act-desc { font-size: 10.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; text-align: right; flex: 0 3 auto; }
  .mem-input { flex: 1; margin: 4px 10px 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 8px; font-family: var(--mono); font-size: 12px; color: var(--text); resize: none; outline: none; line-height: 1.45; }
  .mem-input:focus { border-color: var(--accent); }
  /* Micro-Bot Peer Cards & Sidebar Call Button */
  .proj-call { background: transparent; border: none; padding: 2px; border-radius: 4px; color: var(--muted); cursor: pointer; display: none; align-items: center; justify-content: center; line-height: 0; }
  .proj-item:hover .proj-call { display: inline-flex; }
  .proj-call:hover { color: var(--accent); background: var(--accent-bg); }
  .peer-card { border: 1px solid color-mix(in srgb, var(--cyan) 35%, var(--border)); background: var(--panel); border-radius: 8px; overflow: hidden; margin-bottom: 2px; }
  .peer-head { padding: 7px 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--cyan) 6%, var(--panel)); cursor: pointer; }
  .peer-head:hover { background: var(--hover); }
  .peer-title { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; overflow: hidden; }
  .peer-brief { color: var(--muted); font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .peer-tag { font-family: var(--mono); font-size: 10.5px; color: var(--cyan); padding: 1px 6px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--cyan) 35%, var(--border)); background: color-mix(in srgb, var(--cyan) 10%, transparent); flex-shrink: 0;  display: inline-flex; align-items: center; gap: 1.2ch; }
  .peer-body { padding: 10px 12px; line-height: 1.55; }
  .peer-card .tool-raw { border-top: 1px solid var(--border); display: none; }
  .peer-card.open .tool-raw { display: block; }
  .call-route { display: flex; align-items: stretch; gap: 8px; }
  .call-node { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; text-align: left; }
  .call-node-btn { cursor: pointer; transition: background .12s, border-color .12s; }
  .call-node-btn:hover, .call-node-btn.open { background: var(--hover); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .call-node-btn.open .chev { transform: rotate(180deg); }
  .call-arrow { display: flex; align-items: center; color: var(--muted); flex-shrink: 0; font-size: 13px; }
  .call-meta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .call-name { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .call-sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;  display: flex; align-items: center; gap: 1.2ch; }
  .call-targets { max-height: 168px; overflow-y: auto; display: none; flex-direction: column; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  .call-targets.open { display: flex; }
  .call-target-opt { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; text-align: left; }
  .call-target-opt:hover { background: var(--hover); }
  .call-target-opt.active { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .call-prompt { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; resize: vertical; min-height: 76px; max-height: 180px; line-height: 1.45; }
  .call-prompt:focus { border-color: var(--accent); }
  .bot-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .bot-opt { height: 46px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); padding: 0; transition: background .12s, border-color .12s, color .12s; }
  .bot-opt:hover:not(:disabled) { background: var(--hover); color: var(--text); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .bot-opt.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .bot-opt:disabled { opacity: 0.28; }
  .collab-chip { height: 26px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .12s, border-color .12s, color .12s; }
  .collab-chip:hover { background: var(--hover); color: var(--text); }
  .collab-chip.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 500; }

  /* Center Chat */
  .center { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .stream { flex: 1; overflow-y: auto; padding: 18px 24px; display: flex; flex-direction: column; gap: 14px; scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 35%, transparent) transparent; }
  .stream::-webkit-scrollbar, .proj-list::-webkit-scrollbar, .file-list::-webkit-scrollbar, .modal-pane::-webkit-scrollbar { width: 6px; }
  .stream::-webkit-scrollbar-track, .proj-list::-webkit-scrollbar-track, .file-list::-webkit-scrollbar-track, .modal-pane::-webkit-scrollbar-track { background: transparent; }
  .stream::-webkit-scrollbar-thumb, .proj-list::-webkit-scrollbar-thumb, .file-list::-webkit-scrollbar-thumb, .modal-pane::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 35%, transparent); border-radius: 99px; }
  .stream::-webkit-scrollbar-thumb:hover, .proj-list::-webkit-scrollbar-thumb:hover, .file-list::-webkit-scrollbar-thumb:hover, .modal-pane::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted) 65%, transparent); }
  .turn-wrap { max-width: 820px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg-user { align-self: flex-end; background: var(--user-bg); border: 1px solid var(--user-border); color: var(--user-text); padding: 8px 12px; border-radius: 8px; max-width: 74%; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }

  .ans-body > :first-child { margin-top: 0; }

  .ans-body p:last-child { margin-bottom: 0; }

  .ans-body hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .ans-body code { font-family: var(--mono); font-size: var(--code-size); background: var(--card); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--code-border); font-variant-ligatures: none; }

  /* Tool Cards & Framed Error Card */

  .err-acts { display: flex; justify-content: flex-end; }
  .diff-box { border-top: 1px solid var(--border); background: var(--code-bg); font-family: var(--mono); font-size: var(--code-size); overflow-x: auto; padding: 4px 0; tab-size: 4; font-variant-ligatures: none; }
  .diff-line { padding: 0 10px 0 0; white-space: pre; display: flex; gap: 10px; min-width: max-content; border-left: 2px solid transparent; }

  .diff-line.del { background: var(--del-bg); border-left-color: var(--del-text); }
  .diff-line.ctx { color: var(--muted); }
  .diff-num { width: 46px; padding: 1px 6px; text-align: right; color: var(--dim); user-select: none; flex-shrink: 0; }
  .diff-line.del .diff-num { background: var(--del-bg); color: var(--del-text); }
  .diff-line.add .diff-num { background: var(--add-bg); color: var(--add-text); }
  .tool-raw { border-top: 1px solid var(--border); padding: 8px 11px; margin: 0; font-family: var(--mono); font-size: var(--code-size); color: var(--muted); white-space: pre-wrap; max-height: 240px; overflow-y: auto; display: none; font-variant-ligatures: none; }
  .tool-card.open .tool-raw { display: block; }

  /* Security Gate Card */
  .gate-card { border: 1px solid var(--warn-border); background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .gate-title { color: var(--warn-text); font-weight: 600; font-size: 12px; }
  .gate-cmd { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 6px 8px; border-radius: 5px; border: 1px solid var(--border); overflow-x: auto; }
  .gate-actions { display: flex; gap: 8px; }

  /* Composer */
  .composer-wrap { padding: 10px 24px 16px; background: var(--bg); }
  .composer { position: relative; max-width: 820px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px 9px; display: flex; flex-direction: column; gap: 8px; transition: border-color .15s; }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
  .img-strip { display: none; gap: 6px; flex-wrap: wrap; }
  .img-strip.open { display: flex; }
  .img-thumb { position: relative; width: 44px; height: 44px; border-radius: 6px; border: 1px solid var(--border); overflow: hidden; background: var(--bg); }
  .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-rm { position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; border: none; background: rgba(0,0,0,.75); color: #fff; font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .msg-imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .msg-img { max-width: 180px; max-height: 140px; border-radius: 6px; border: 1px solid var(--border); object-fit: cover; display: block; }
  .composer textarea { width: 100%; background: transparent; border: none; outline: none; resize: none; min-height: 36px; max-height: 180px; line-height: 1.45; color: var(--text); }
  .comp-bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .comp-left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; min-height: 30px; }
  .comp-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  #skills-bar { display: contents; }
  #btn-model-pill { max-width: min(340px, 100%); gap: 1.5ch; overflow: hidden; }
  .mp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 500; }
  .mp-ext { color: var(--muted); flex-shrink: 0; }
  .micro-pill { height: 26px; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 0 10px; font: inherit; font-size: 12px; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; user-select: none; transition: background .12s, border-color .12s, color .12s; }
  .micro-pill:hover, .micro-pill.open { background: var(--hover); }
  .micro-pill.muted { color: var(--muted); }
  .micro-pill.muted:hover, .micro-pill.muted.open { color: var(--text); }
  .pop-wrap { position: relative; display: inline-flex; }
  .pop { position: absolute; bottom: calc(100% + 6px); left: 0; min-width: 168px; max-height: min(320px, 55vh); overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 4px; display: none; flex-direction: column; gap: 1px; box-shadow: 0 12px 28px rgba(0,0,0,.32); z-index: 30; }
  .pop.open { display: flex; }
  .pop button { background: transparent; border: none; border-radius: 6px; padding: 6px 9px; text-align: left; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; white-space: nowrap; }
  .pop button:hover, .pop button.on { background: var(--hover); color: var(--text); }
  .pop button.on { color: var(--accent); font-weight: 600; }
  .chev { width: 11px; height: 11px; opacity: .65; flex-shrink: 0; transition: transform .15s; }

  .skill-chip { height: 26px; font-size: 12px; padding: 0 9px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--cyan) 40%, var(--border)); color: var(--cyan); background: color-mix(in srgb, var(--cyan) 12%, transparent); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; user-select: none; transition: .12s; }
  .skill-chip.off { border-color: var(--border); color: var(--muted); background: var(--panel); opacity: .75; }
  .skill-chip.off:hover { opacity: 1; color: var(--text); background: var(--hover); }
  .chip-x { opacity: .65; font-size: 10px; line-height: 1; padding: 0 1px; }

  .ac-pop { position: absolute; bottom: calc(100% + 8px); left: 0; right: 0; max-height: min(220px, 40vh); overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 5px; display: none; flex-direction: column; gap: 2px; box-shadow: 0 14px 32px rgba(0,0,0,.5); z-index: 30; }
  .ac-pop.open { display: flex; }
  .ac-item { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .ac-item.hl, .ac-item:hover { background: var(--hover); color: var(--text); }
  .ac-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ac-key { font-family: var(--mono); color: var(--text); font-weight: 600; white-space: nowrap; }
  .ac-desc { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Modals */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.68); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-backdrop.open { display: flex; }
  .modal { width: 760px; max-width: 94vw; height: 540px; max-height: 88vh; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
  .modal-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .modal-body { flex: 1; display: flex; min-height: 0; }
  .modal-nav { width: 190px; border-right: 1px solid var(--border); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; background: var(--nav-bg); }
  .nav-group { font-size: 10px; color: var(--muted); opacity: 0.58; padding: 6px 10px 4px; font-weight: 600; letter-spacing: .08em; user-select: none; }
  .nav-btn + .nav-group { margin-top: 8px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--border) 65%, transparent); }
  .nav-btn { text-align: left; background: transparent; border: 1px solid transparent; padding: 7px 10px; border-radius: 6px; cursor: pointer; color: color-mix(in srgb, var(--text) 78%, var(--muted)); }
  .nav-btn:hover { background: var(--hover); color: var(--text); }
  .nav-btn.active { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); font-weight: 500; }
  .modal-pane { flex: 1; padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; gap: 12px; }
  .setting-row select, .comp-select { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 12px; color: var(--text); outline: none; cursor: pointer; transition: border-color .12s, background .12s; }
  .setting-row select:hover, .comp-select:hover { background: var(--hover); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .setting-row select:focus, .comp-select:focus { border-color: var(--accent); }
  .setting-row.active-slot { border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: var(--accent-bg); }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field input, .field select { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; color: var(--text); }
  .switch { width: 32px; height: 18px; border-radius: 99px; border: 1px solid var(--border); background: var(--bg); position: relative; cursor: pointer; flex-shrink: 0; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
  .switch.on { background: var(--accent); border-color: var(--accent); }
  .switch.on::after { transform: translateX(14px); background: var(--accent-fg); }
  .skills-filter { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; outline: none; font-size: 12px; }
  .skills-filter:focus { border-color: var(--cyan); }
  .theme-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .theme-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; cursor: pointer; display: flex; align-items: center; gap: 9px; text-align: left; min-width: 0; }
  .theme-card:hover { background: var(--hover); }
  .theme-card.active { border-color: var(--accent); background: var(--accent-bg); }
  .theme-swatch { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); flex-shrink: 0; }
  .theme-meta { min-width: 0; display: flex; flex-direction: column; }
  .theme-name { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .theme-tag { font-size: 10px; color: var(--dim); }
  .theme-card { position: relative; }
  .theme-meta { flex: 1; }
  .theme-del { margin-left: auto; background: transparent; border: none; color: var(--dim); cursor: pointer; font-size: 10px; padding: 2px 5px; border-radius: 4px; display: none; flex-shrink: 0; }
  .theme-card:hover .theme-del, .theme-del.arm, .noc-row:hover .theme-del { display: inline-flex; align-items: center; }
  .noc-list { display: flex; flex-direction: column; gap: 6px; }
  .noc-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; text-align: left; }
  .noc-row:hover { background: var(--hover); }
  .noc-row.active { border-color: var(--accent); background: var(--accent-bg); }
  .noc-swatches { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .noc-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border); }
  .theme-del:hover, .theme-del.arm { color: var(--err-text); background: var(--del-bg); }
  .file-view-pre { flex: 1; margin: 0; padding: 12px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; overflow: auto; font-family: var(--mono); font-size: var(--code-size); line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .muted { color: var(--muted); font-size: 12px; }
  .center.is-empty { overflow-y: auto; }
  .center.is-empty .stream { flex: 0 0 auto; overflow: visible; margin-top: auto; padding: 24px 24px 20px; scrollbar-gutter: auto; }
  .center.is-empty .composer-wrap { margin-bottom: auto; padding: 0 24px 38px; }
  .center.is-empty .composer { max-width: 720px; }
  .empty-state { margin: 0 auto; text-align: center; color: var(--muted); max-width: 560px; line-height: 1.55; }
  .empty-title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--text); text-wrap: balance; }
  .empty-sub { font-size: 12px; color: var(--muted); opacity: 0.68; margin-top: 6px; text-wrap: balance; }
</style>

<div class="app">
  <header class="topbar">

  <div class="main">

        </div>
        <button class="btn btn-sm btn-icon" id="btn-new-proj" aria-label="New Workspace"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="8" y1="3.5" x2="8" y2="12.5"/><line x1="3.5" y1="8" x2="12.5" y2="8"/></svg></button>
      </div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let STATE = null;
let ACTIVE_TAB = "providers";
let STREAMING = false;
let skillFilter = "";
let lastSentPayload = null;
let noctaliaBrowse = false, noctaliaSource = "core", noctaliaMode = "dark", noctaliaFilter = "", noctaliaCore = null, noctaliaCommunity = null, noctaliaWarn = "", noctaliaBusy = "";

const BUILTIN_THEMES = [
  { id:"dark-default", name:"Dark Default", mode:"dark", bg:"#09090b", panel:"#0f0f12", card:"#16161a", border:"#232329", text:"#ececef", muted:"#8e8e98", accent:"#1a73e8", cyan:"#669df6", active_bg:"#151923", active_border:"#28344d" }
];

const DEFAULT_APPEARANCE = {
  theme: "dark-default",
  uiFont: "JetBrains Mono",
  uiSize: 13,
  codeFont: "JetBrains Mono",
  codeSize: 12,
  logoStyle: "d",
  microBots: true,
  showDesc: false
};

function hexLum(hex) {
  const h = String(hex || "").replace("#", "");
  if (h.length < 6) return 0;
  const r = parseInt(h.slice(0,2), 16) || 0, g = parseInt(h.slice(2,4), 16) || 0, b = parseInt(h.slice(4,6), 16) || 0;
  return (r * 299 + g * 587 + b * 114) / 1000;
}

function getAppearance() {
  try {
    const c = { ...DEFAULT_APPEARANCE, ...JSON.parse(localStorage.getItem("rs_rail_appearance") || "{}") };
    if (c.theme === "pitch-dark") c.theme = "dark-default";
    if (c.theme === "pure-light") c.theme = "custom:pure-light";
    return c;
  }
  catch { return { ...DEFAULT_APPEARANCE }; }
}

function allThemes() {
  return [...BUILTIN_THEMES, ...(STATE?.themes || [])];
}

const BRAND_GRAD_DEFS = `<defs><linearGradient id="brandGrad" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="13" y2="13"><stop offset="0%" stop-color="var(--text)"/><stop offset="100%" stop-color="var(--accent)"/></linearGradient></defs>`;

function isBotMode(cfg) {
  const b = (cfg || getAppearance()).microBots;
  return b !== "none" && b !== false && b !== "letters";
}

function renderBrandLogo(cfg) {
  const btn = $("btn-brand-settings");
  if (!btn) return;
  const c = cfg || getAppearance();
  const isMono = (c.logoStyle || "d") === "a";
  const badgeMode = c.microBots === "none" ? "none" : (c.microBots === false || c.microBots === "letters" ? "letters" : "bots");
  const ap = STATE?.active_project;
  const canPick = Boolean(ap && badgeMode === "bots");
  btn.classList.toggle("clickable", canPick);
  btn.tabIndex = canPick ? 0 : -1;
  if (canPick) {
    btn.title = "Bot Setup & Micro-Bot";
    btn.setAttribute("aria-label", "Bot Setup & Micro-Bot");
  } else {
    btn.removeAttribute("title");
    btn.removeAttribute("aria-label");
  }
  if (ap && badgeMode === "bots") {
    btn.innerHTML = botSvg(ap.name, 17, isMono ? "currentColor" : "url(#brandGrad)", isMono ? "" : BRAND_GRAD_DEFS);
  } else {
    const stroke = isMono ? "currentColor" : "url(#brandGrad)";
    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${isMono ? "" : BRAND_GRAD_DEFS}<path id="brand-path" d="M 7.2 3.5 L 12.7 8 L 7.2 12.5 L 3.7 12.5" stroke="${stroke}"/></svg>`;
  }
}

function applyAppearance(next) {
  const cfg = next ? { ...getAppearance(), ...next } : getAppearance();
  localStorage.setItem("rs_rail_appearance", JSON.stringify(cfg));
  let t = allThemes().find((x) => x.id === cfg.theme);
  if (t) {
    localStorage.setItem("rs_rail_theme_cache", JSON.stringify(t));
  } else {
    try {
      const cached = JSON.parse(localStorage.getItem("rs_rail_theme_cache") || "null");
      if (cached && cached.id === cfg.theme) t = cached;
    } catch {}
  }
  if (!t) t = BUILTIN_THEMES[0];

  const isLight = t.mode === "light";
  const accentFg = hexLum(t.accent) > 145 ? "#05140a" : "#ffffff";

  const vars = {
    "--bg": t.bg, "--panel": t.panel, "--card": t.card, "--border": t.border,
    "--text": t.text, "--muted": t.muted,
    "--dim": `color-mix(in srgb, ${t.muted} 82%, ${t.bg})`,
    "--hover": `color-mix(in srgb, ${t.text} 6%, ${t.card})`,
    "--nav-bg": `color-mix(in srgb, ${t.bg} 55%, ${t.panel})`,
    "--code-bg": `color-mix(in srgb, ${t.bg} ${isLight ? "35%" : "75%"}, ${t.panel})`,
    "--code-border": t.border,
    "--code-head": t.panel,
    "--accent": t.accent, "--accent-fg": accentFg,
    "--accent-bg": `color-mix(in srgb, ${t.accent} 14%, transparent)`,
    "--topbar-bg": t.topbar_bg || t.panel,
    "--user-bg": t.user_bg || `color-mix(in srgb, ${t.accent} ${isLight ? "20%" : "22%"}, ${t.panel})`,
    "--user-border": t.user_border || `color-mix(in srgb, ${t.accent} ${isLight ? "34%" : "42%"}, ${t.border})`,
    "--user-text": t.text,
    "--active-bg": t.active_bg || `color-mix(in srgb, ${t.accent} 16%, ${t.panel})`,
    "--active-border": t.active_border || `color-mix(in srgb, ${t.accent} 48%, ${t.border})`,
    "--cyan": t.cyan || t.accent,
    "--err-text": isLight ? "#dc2626" : "#fca5a5",
    "--del-bg": isLight ? "rgba(220,38,38,0.10)" : "rgba(239,68,68,0.14)",
    "--del-text": isLight ? "#b91c1c" : "#fca5a5",
    "--add-bg": isLight ? "rgba(22,163,74,0.10)" : "rgba(34,197,94,0.14)",
    "--add-text": isLight ? "#15803d" : "#86efac",
    "--warn-bg": isLight ? "rgba(217,119,6,0.10)" : "rgba(245,158,11,0.08)",
    "--warn-border": isLight ? "rgba(217,119,6,0.45)" : "rgba(245,158,11,0.45)",
    "--warn-text": isLight ? "#b45309" : "#fcd34d",
    "--syn-kw": isLight ? "#1d4ed8" : "#8ab4f8",
    "--syn-str": isLight ? "#15803d" : "#86efac",
    "--syn-num": isLight ? "#b45309" : "#fcd34d",
    "--syn-cmt": `color-mix(in srgb, ${t.muted} 70%, ${t.bg})`
  };
  const root = document.documentElement.style;
  root.colorScheme = isLight ? "light" : "dark";
  for (const [k, v] of Object.entries(vars)) root.setProperty(k, v);
  const uiMap = {
    "JetBrains Mono": '"JetBrainsMono Nerd Font", "JetBrainsMono NF", "JetBrains Mono", ui-monospace, monospace',
    "Geist": '"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
    "System": '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
  };
  const codeMap = {
    "JetBrains Mono": '"JetBrainsMono Nerd Font", "JetBrainsMono NF", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace',
    "Fira Code": '"Fira Code", "JetBrains Mono", ui-monospace, monospace',
    "System": 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace'
  };
  root.setProperty("--sans", uiMap[cfg.uiFont] || uiMap["JetBrains Mono"]);
  root.setProperty("--mono", codeMap[cfg.codeFont] || codeMap["JetBrains Mono"]);
  root.setProperty("--ui-size", `${cfg.uiSize || 13}px`);
  root.setProperty("--code-size", `${cfg.codeSize}px`);
  document.body.classList.toggle("theme-dark", !isLight);
  renderBrandLogo(cfg);
  resizeInput();
}
applyAppearance();

const SLASH_CMDS = [
  { cmd: "/task", desc: "Run autonomous goal loop" },
  { cmd: "/r", desc: "Reset active session" },
  { cmd: "/s", desc: "Attach or detach skills (max 3)" },
  { cmd: "/p", desc: "Select agent profile" },
  { cmd: "/ms", desc: "Providers & models" },
  { cmd: "/tk", desc: "Toggle auto-expand steps" },
  { cmd: "/export", desc: "Export transcript to .rs/transcripts/" },
  { cmd: "/call", desc: "Ask another project bot" },
];

function renderProseBlock(raw) {
  const inline = (s) => esc(s).replace(/`([^`]+)`|\*\*([^*]+)\*\*/g, (_, code, bold) =>
    code !== undefined ? `<code>${code}</code>` : `<strong>${bold}</strong>`
  );
  const lines = raw.split(/\r?\n/);
  let html = "", listTag = "", para = [];
  const flushPara = () => { if (para.length) { html += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
  const closeList = () => { if (listTag) { html += `</${listTag}>`; listTag = ""; } };
  for (const line of lines) {
    const t = line.trim();
    if (!t) { flushPara(); closeList(); continue; }
    if (t === "---" || t === "***") { flushPara(); closeList(); html += "<hr>"; continue; }
    const hm = line.match(/^(#{1,3})\s+(.+)$/);
    if (hm) {
      flushPara(); closeList();
      const tag = hm[1].length === 1 ? "h2" : (hm[1].length === 2 ? "h3" : "h4");
      html += `<${tag}>${inline(hm[2])}</${tag}>`;
      continue;
    }
    const ulm = line.match(/^\s*[-*]\s+(.+)$/);
    const olm = !ulm && line.match(/^\s*\d+\.\s+(.+)$/);
    if (ulm || olm) {
      flushPara();
      const tag = ulm ? "ul" : "ol";
      if (listTag !== tag) { closeList(); html += `<${tag}>`; listTag = tag; }
      html += `<li>${inline((ulm || olm)[1])}</li>`;
      continue;
    }
    closeList();
    para.push(line);
  }
  flushPara();
  closeList();
  return html;
}

function highlightCode(raw) {
  const re = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|("{3}[\s\S]*?"{3}|'{3}[\s\S]*?'{3}|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(fn|let|mut|pub|struct|enum|impl|trait|match|if|elif|else|for|while|loop|return|use|mod|async|await|const|static|type|where|def|class|import|from|try|except|finally|raise|with|as|pass|in|not|and|or|is|lambda|yield|None|True|False|function|export|default|switch|case|break|continue|new|this|true|false|null|undefined|var|int|void|bool|str|self|Self)\b|\b(\d+(?:\.\d+)?)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    if (m.index > last) out += esc(raw.slice(last, m.index));
    const cls = m[1] ? "tok-c" : m[2] ? "tok-s" : m[3] ? "tok-k" : "tok-n";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(raw.slice(last));
}

function renderMarkdown(text) {
  const src = String(text || "");
  const re = /```([^\n`]*)\r?\n([\s\S]*?)```/g;
  const codeBlock = (lang, code) =>
    `<div class="code-wrap"><div class="code-head"><span>${esc(lang.trim() || "text")}</span><button class="btn btn-sm" onclick="navigator.clipboard.writeText(this.closest('.code-wrap').querySelector('pre').innerText)">Copy</button></div><pre>${highlightCode(code)}</pre></div>`;
  let html = "", last = 0, m;
  while ((m = re.exec(src)) !== null) {
    if (m.index > last) html += renderProseBlock(src.slice(last, m.index));
    html += codeBlock(m[1], m[2]);
    last = re.lastIndex;
  }
  const tail = src.slice(last);
  const open = tail.match(/^([\s\S]*?)```([^\n`]*)\r?\n([\s\S]*)$/);
  if (open) {
    if (open[1]) html += renderProseBlock(open[1]);
    html += codeBlock(open[2], open[3]);
  } else if (tail) {
    html += renderProseBlock(tail);
  }
  return html || "<p></p>";
}

async function api(path, body) {

}

function loadPinnedMap() {
  try { return JSON.parse(localStorage.getItem("rs_rail_pinned_skills") || "{}"); }
  catch { return {}; }
}
function savePinnedMap(map) {
  localStorage.setItem("rs_rail_pinned_skills", JSON.stringify(map));
}
function syncPinnedSkills(proj, activeSkills) {
  const map = loadPinnedMap();
  const list = Array.isArray(map[proj]) ? [...map[proj]] : [];
  let changed = false;
  for (const sk of activeSkills) {
    if (!list.includes(sk)) { list.push(sk); changed = true; }
  }
  const avail = new Set(STATE?.skills || []);
  const clean = avail.size ? list.filter((s) => avail.has(s)) : list;
  if (clean.length !== list.length) changed = true;
  if (changed) { map[proj] = clean; savePinnedMap(map); }
  return clean;
}
function unpinSkill(proj, sk) {
  const map = loadPinnedMap();
  if (Array.isArray(map[proj])) {
    map[proj] = map[proj].filter((x) => x !== sk);
    savePinnedMap(map);
  }
}

function hashBotMask(name) {
  let h = 2166136261;
  for (let i = 0; i < name.length; i++) h = Math.imul(h ^ name.charCodeAt(i), 16777619);
  let mask = 0;
  for (let i = 0; i < 15; i++) {
    if ((h >> i) & 1 || i === 4) mask |= (1 << i);
  }
  return mask;
}
function parseBotVal(val) {
  if (typeof val !== "string" || !val.startsWith("b:")) return null;
  const n = parseInt(val.slice(2), 16);
  return Number.isFinite(n) ? ((n & 0x7fff) | (1 << 4)) : null;
}
function projectBotMask(name) {
  return parseBotVal(STATE?.ui_prefs?.project_bots?.[name]) ?? hashBotMask(name);
}
function botSvgFromMask(mask, size = 12, fill = "currentColor", defs = "") {
  const rects = [];
  for (let y = 0; y < 5; y++) {
    for (let x = 0; x < 3; x++) {
      if ((mask >> (y * 3 + x)) & 1 || (y === 1 && x === 1)) {
        rects.push(`<rect x="${3 + x * 2}" y="${3 + y * 2}" width="2" height="2" rx="0.4"/>`);
        if (x < 2) rects.push(`<rect x="${11 - x * 2}" y="${3 + y * 2}" width="2" height="2" rx="0.4"/>`);
      }
    }
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="${fill}" aria-hidden="true">${defs}${rects.join("")}</svg>`;
}
function botSvg(name, size = 12, fill = "currentColor", defs = "") {
  return botSvgFromMask(projectBotMask(name), size, fill, defs);
}

function fitSubWords(str, maxChars) {
  const s = String(str || "").trim();
  if (!s || s.length <= maxChars) return s;
  let cut = s.slice(0, maxChars + 1);
  const sp = cut.lastIndexOf(" ");
  cut = sp > 0 ? cut.slice(0, sp) : s.slice(0, maxChars);
  const openP = cut.lastIndexOf("(");
  if (openP > 0 && cut.indexOf(")", openP) === -1) cut = cut.slice(0, openP);
  return cut.replace(/[\s&+\-/:,(]+$/, "").trim();
}

  $("stream").classList.toggle("chat-mode", !ap.is_agent);
  renderHistory();
  if ($("modal-settings").classList.contains("open")) renderModalTab();
  if ($("modal-call").classList.contains("open")) renderCallModal();
  if ($("modal-actions").classList.contains("open")) renderManageActions();
}

function renderHistory() {
  const stream = $("stream");
  const msgs = STATE.active_project.history || [];
  document.querySelector(".center").classList.toggle("is-empty", !msgs.length);
  if (!msgs.length) {
    stream.innerHTML = "";
    stream.appendChild(createEmpty());
    return;
  }
  stream.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "turn-wrap";
  let step = 0, inRound = false;
  for (const m of msgs) {
    if (m.role === "user") {
      step = 0; inRound = false;
      wrap.appendChild(buildUserEl(m.content || "", m.images || []));
    } else if (m.role === "assistant") {
      step += 1; inRound = true;
      wrap.appendChild(buildAssistantEl(m.reasoning || "", m.content || "", m.elapsed_s, step));
    } else if (m.role === "tool_card") {
      if (!inRound) { step += 1; inRound = true; }
      wrap.appendChild(buildToolCard(m));
    } else if (m.role === "peer_call") {
      if (!inRound) { step += 1; inRound = true; }
      wrap.appendChild(buildPeerCard(m));
    }
  }
  stream.appendChild(wrap);
  stream.scrollTop = stream.scrollHeight;
}

function buildUserEl(text, images) {
  const u = document.createElement("div");
  u.className = "msg-user";
  if (images && images.length) {
    const row = document.createElement("div");
    row.className = "msg-imgs";
    for (const src of images) {
      const im = document.createElement("img");
      im.className = "msg-img";
      im.src = src;
      row.appendChild(im);
    }
    u.appendChild(row);
  }
  if (text) {
    const t = document.createElement("div");
    t.textContent = text;
    u.appendChild(t);
  }
  return u;
}

function createEmpty() {
  const d = document.createElement("div");
  d.id = "empty-state";
  d.className = "empty-state";
  const ap = STATE?.active_project;
  if (!ap) {
    d.innerHTML = `<div class="empty-title">Ready</div><div class="empty-sub">Loading workspace...</div>`;
    return d;
  }
  const verb = ap.is_agent ? "build" : "explore";
  const tagTxt = STATE?.ui_prefs?.project_descriptions?.[ap.name] || ap.tagline;
  const sub = tagTxt ? `<div class="empty-sub">${esc(tagTxt)}</div>` : "";
  d.innerHTML = `<div class="empty-title">What should we ${verb} in ${esc(projDisplay(ap.name))}?</div>${sub}`;
  return d;

const THINK_CHEV = `<svg class="think-chev" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg>`;
function thinkMeta(len, elapsed) {
  if (typeof elapsed === "number") return elapsed >= 10 ? `${Math.round(elapsed)}s` : `${elapsed.toFixed(1)}s`;
  return `${Math.max(1, Math.round(len / 4))}t`;
}

function stepTitle(n) {
  return STATE?.active_project?.is_agent ? `${n} Step` : "Thought";
}

function buildAssistantEl(reasoning, content, elapsed, step) {
  const box = document.createElement("div");
  box.className = "msg-assistant";
  if (reasoning) {
    const det = document.createElement("details");
    det.className = "think-box";
    if (STATE?.ui_prefs?.show_thinking !== false) det.open = true;
    det.innerHTML = `<summary><span class="think-step">${esc(stepTitle(step || 1))}</span><span class="think-meta">${thinkMeta(reasoning.length, elapsed)}</span>${THINK_CHEV}</summary><div class="think-body">${esc(reasoning)}</div>`;
    box.appendChild(det);
  }
  if (content) {
    const row = document.createElement("div");
    row.className = "ans-row";
    row.innerHTML = `<span class="bullet">●</span><div class="ans-body">${renderMarkdown(content)}</div>`;
    box.appendChild(row);
  }
  return box;
}

function buildToolCard(t) {
  const card = document.createElement("div");
  card.className = "tool-card";
  const label = ({ read_file:"Read", edit_file:"Edit", write_file:"Write", list_dir:"List", search_code:"Search", run_command:"Bash" }[t.name] || t.name);
  card.innerHTML = `
    <div class="tool-head">
      <div class="tool-title"><span class="bullet">●</span><strong>${esc(label)}</strong><span class="tool-brief">(${esc(t.brief || "")})</span></div>
      <span class="muted">${t.elapsed_s !== undefined ? t.elapsed_s.toFixed(1)+"s" : ""}</span>
    </div>
    <div class="tool-summary ${t.ok ? "" : "tool-err"}">⎿ ${esc(t.summary || "")}</div>
  `;
  if (t.diff && t.diff.lines && t.diff.lines.length) {
    const db = document.createElement("div");
    db.className = "diff-box";
    for (const ln of t.diff.lines) {
      const sign = ln.kind === "add" ? "+" : ln.kind === "del" ? "-" : " ";
      const r = document.createElement("div");
      r.className = `diff-line ${ln.kind}`;
      r.innerHTML = `<span class="diff-num">${ln.num || ""} ${sign}</span><span>${highlightCode(ln.text)}</span>`;

  return card;

function buildPeerCard(m) {
  const card = document.createElement("div");
  card.className = "peer-card";
  const tName = m.name || "peer";

  const tag = tagParts.length ? `<span class="peer-tag">${tagParts.map(t => `<span>${esc(t)}</span>`).join("")}</span>` : "";

    ? `<div class="tool-err">${esc(m.content || "Peer call failed")}</div>`
    : `<div class="ans-body">${renderMarkdown(m.content || "")}</div>`;

async function runLocalSlash(text) {
  const low = text.toLowerCase();
  if (low === "/r" || low === "/reset") { await api("/api/reset", {}); await loadState(); return true; }
  if (low === "/p" || low === "/profile") { openSettings("profiles"); return true; }
  if (low === "/ms" || low === "/model") { openSettings("providers"); return true; }
  if (low === "/tk" || low === "/think") { await api("/api/settings/ui", { show_thinking: STATE?.ui_prefs?.show_thinking === false }); await loadState(); return true; }
  if (low === "/s" || low === "/skill") { openSettings("skills"); return true; }
  if (low === "/call" || low.startsWith("/call ") || low.startsWith("/call:")) {
    if (!isBotMode()) return true;
    const raw = text.slice(5).trim();
    if (!raw) { openCallModal(); return true; }
    const m = raw.match(/^@?([a-zA-Z0-9_-]+)(?::\s*|\s+)([\s\S]*)$/);
    const targetToken = m ? m[1].toLowerCase() : raw.replace(/^@/, "").replace(/:$/, "").trim().toLowerCase();
    const promptText = m ? m[2].trim() : "";
    const ap = STATE?.active_project;
    const siblings = (STATE?.projects || []).filter((p) => p.name !== ap?.name);
    const matched = siblings.find((p) => p.name.toLowerCase() === targetToken)
      || siblings.find((p) => p.name.toLowerCase().startsWith(targetToken));
    if (matched && promptText) {
      await executePeerCall(matched.name, "none", promptText);
    } else {
      openCallModal(matched ? matched.name : targetToken, promptText);
    }
    return true;
  }
  if (low === "/export") {
    const res = await api("/api/export", {});
    $("sidebar-right").classList.remove("hidden");
    setRsNote(`Saved ${res.path}`);
    return true;
  }
  if (low.startsWith("/s ") || low.startsWith("/skill ")) {
    const arg = text.split(/\s+/)[1]?.toLowerCase() || "";
    const active = STATE?.active_project?.active_skills || [];
    if (arg === "clear" || arg === "none" || arg === "reset") {
      const m = loadPinnedMap(); delete m[STATE.active_project.name]; savePinnedMap(m);
      for (const s of [...active]) await api("/api/settings/profile", { skill_toggle: s });
      await loadState();
    } else {
      const matchSk = (STATE?.skills || []).find((s) => s.toLowerCase() === arg);
      if (matchSk) { await api("/api/settings/profile", { skill_toggle: matchSk }); await loadState(); }
    }
    return true;
  }
  return false;
}

let pendingImages = [];

function updateSendReady() {
  const ready = ($("msg-input")?.value.trim().length > 0) || pendingImages.length > 0;
  $("btn-send")?.classList.toggle("ready", ready);
}

function renderImgStrip() {
  const strip = $("img-strip");
  strip.innerHTML = "";
  strip.classList.toggle("open", pendingImages.length > 0);
  pendingImages.forEach((src, i) => {
    const box = document.createElement("div");
    box.className = "img-thumb";
    box.innerHTML = `<img src="${src}" /><button class="img-rm" title="Remove">✕</button>`;
    box.querySelector("button").onclick = () => { pendingImages.splice(i, 1); renderImgStrip(); };
    strip.appendChild(box);
  });
  updateSendReady();
}

function addImageFiles(files) {
  for (const f of Array.from(files || [])) {
    if (!f.type.startsWith("image/") || pendingImages.length >= 4) continue;
    const rd = new FileReader();
    rd.onload = () => {
      if (typeof rd.result === "string" && pendingImages.length < 4) {
        pendingImages.push(rd.result);
        renderImgStrip();
      }
    };
    rd.readAsDataURL(f);
  }
}

async function sendMessage(overrideText, overrideImgs) {
  if (STREAMING) return;
  const text = overrideText !== undefined ? overrideText : $("msg-input").value.trim();
  const imgs = overrideText !== undefined ? (overrideImgs || []) : [...pendingImages];
  if (!text && !imgs.length) return;
  if (overrideText === undefined) {
    $("msg-input").value = "";
    resizeInput();
    pendingImages = [];
    renderImgStrip();
  }
  closeAc();
  closeReasoningPop();
  if (!imgs.length && text.startsWith("/") && await runLocalSlash(text)) return;

  lastSentPayload = { text, imgs };
  STREAMING = true;
  $("btn-send").style.display = "none";
  $("btn-stop").style.display = "inline-flex";

  const stream = $("stream");
  if ($("empty-state")) stream.innerHTML = "";
  document.querySelector(".center").classList.remove("is-empty");
  let wrap = stream.querySelector(".turn-wrap");
  if (!wrap) { wrap = document.createElement("div"); wrap.className = "turn-wrap"; stream.appendChild(wrap); }

  wrap.appendChild(buildUserEl(text, imgs));

  let curThink = "", curAns = "";
  let liveAsst = document.createElement("div");
  liveAsst.className = "msg-assistant";
  wrap.appendChild(liveAsst);
  stream.scrollTop = stream.scrollHeight;

  let liveStep = 1, needNextStep = false, rafId = 0, dirtyThink = false, dirtyAns = false;
  let thinkDet = null, thinkCount = null, thinkBody = null, thinkT0 = 0;
  let ansRow = null, ansBody = null;
  const resetLiveNodes = () => {
    curThink = ""; curAns = ""; thinkT0 = 0; needNextStep = true; dirtyThink = false; dirtyAns = false;
    thinkDet = thinkCount = thinkBody = ansRow = ansBody = null;
    liveAsst = document.createElement("div");
    liveAsst.className = "msg-assistant";
    wrap.appendChild(liveAsst);
  };
  const scrollNearBottom = () => {
    if (stream.scrollHeight - stream.scrollTop - stream.clientHeight < 96) {
      stream.scrollTop = stream.scrollHeight;
    }
  };
  const updateLive = (isThink) => {
    if (needNextStep) { liveStep += 1; needNextStep = false; }
    if (isThink) {
      if (!thinkT0) thinkT0 = performance.now();
      if (!thinkDet) {
        thinkDet = document.createElement("details");
        thinkDet.className = "think-box";
        if (STATE?.ui_prefs?.show_thinking !== false) thinkDet.open = true;
        thinkDet.innerHTML = `<summary><span class="think-step">${esc(stepTitle(liveStep))}</span><span class="think-meta"></span>${THINK_CHEV}</summary><div class="think-body"></div>`;
        thinkCount = thinkDet.querySelector(".think-meta");
        thinkBody = thinkDet.querySelector(".think-body");
        liveAsst.prepend(thinkDet);
      }
      thinkCount.textContent = thinkMeta(curThink.length, (performance.now() - thinkT0) / 1000);
      thinkBody.textContent = curThink;
    } else {
      if (!ansRow) {
        ansRow = document.createElement("div");
        ansRow.className = "ans-row";
        ansRow.innerHTML = `<span class="bullet">●</span><div class="ans-body"></div>`;
        ansBody = ansRow.querySelector(".ans-body");
        liveAsst.appendChild(ansRow);
      }
      ansBody.innerHTML = renderMarkdown(curAns);
    }
    scrollNearBottom();
  };
  const flushLive = () => {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (dirtyThink) { dirtyThink = false; updateLive(true); }
    if (dirtyAns) { dirtyAns = false; updateLive(false); }
  };
  const schedLive = () => { if (!rafId) rafId = requestAnimationFrame(flushLive); };

  let chatErr = null, errRolledBack = false;
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, images: imgs }),
    });
    if (!resp.ok) throw new Error(await resp.text() || resp.statusText);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const rawEv = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let evName = "message", evData = "";
        for (const line of rawEv.split("\n")) {
          if (line.startsWith("event:")) evName = line.slice(6).trim();
          else if (line.startsWith("data:")) evData += line.slice(5).trim();
        }
        if (!evData) continue;
        const d = JSON.parse(evData);
        if (evName === "thinking" && d.text) { if (!thinkT0) thinkT0 = performance.now(); curThink += d.text; dirtyThink = true; schedLive(); }
        else if (evName === "chunk" && d.text) { curAns += d.text; dirtyAns = true; schedLive(); }
        else if (evName === "tool_result") {
          flushLive();
          wrap.appendChild(buildToolCard(d));
          resetLiveNodes();
          scrollNearBottom();
        } else if (evName === "peer_call") {
          flushLive();
          wrap.appendChild(buildPeerCard(d));
          resetLiveNodes();
          scrollNearBottom();
        } else if (evName === "permission") {
          flushLive();
          const gc = document.createElement("div");
          gc.className = "gate-card";
          gc.innerHTML = `<div class="gate-title">⚠ Security Gate: ${esc(d.title)}</div><div class="gate-cmd">${esc(d.detail)}</div><div class="gate-actions"><button class="btn btn-sm btn-primary">Allow once</button><button class="btn btn-sm btn-danger">Deny</button></div>`;
          const [allowBtn, denyBtn] = gc.querySelectorAll("button");
          const resolvePerm = async (allow) => {
            allowBtn.disabled = denyBtn.disabled = true;
            await api("/api/authorize", { req_id: d.req_id, allow });
            gc.innerHTML = `<div class="muted">${allow ? "✓ Authorized once" : "✗ Denied"}: ${esc(d.title)}</div>`;
          };
          allowBtn.onclick = () => resolvePerm(true);
          denyBtn.onclick = () => resolvePerm(false);
          wrap.appendChild(gc);
          stream.scrollTop = stream.scrollHeight;
        } else if (evName === "error") {
          chatErr = d.message;
          errRolledBack = !!d.rolled_back;
        }
      }
    }
  } catch (err) {
    chatErr = err.message;
      flushLive();
  } finally {
    STREAMING = false;
    $("btn-send").style.display = "inline-flex";
    $("btn-stop").style.display = "none";
    await loadState();
    if (chatErr) {
      if (errRolledBack) {
        if ($("empty-state")) stream.innerHTML = "";
        let w = stream.querySelector(".turn-wrap");
        if (!w) { w = document.createElement("div"); w.className = "turn-wrap"; stream.appendChild(w); }
        w.appendChild(buildUserEl(text, imgs));
      }
      const ec = document.createElement("div");
      ec.className = "err-card";
      ec.innerHTML = `<div class="err-msg">⚠ ${esc(chatErr)}</div><div class="err-acts"><button class="btn btn-sm">Try again</button></div>`;
      ec.querySelector("button").onclick = () => {
        if (lastSentPayload) sendMessage(lastSentPayload.text, lastSentPayload.imgs);
      };
      stream.appendChild(ec);
      stream.scrollTop = stream.scrollHeight;
    }
  }
}

function setActErr(msg) {

function defaultActionsFor(ap) {
  if (!ap) return [];
  const defs = [];
  if (ap.is_agent) {
    defs.push({ cmd: "/task", desc: ap.task_md ? "Run TASK.md" : "Start autonomous goal" });
  }
  if (isBotMode()) {
    defs.push({ cmd: "/call", desc: "Open peer bot picker" });
    for (const c of ap.collaborators || []) {
      const cmd = `/call ${c}`;
      if (!defs.some((a) => a.cmd === cmd)) defs.push({ cmd, desc: "Ask peer" });
    }
  }
  return defs;
}

function getEffectiveActions(ap) {
  if (!ap) return [];
  const saved = STATE?.ui_prefs?.project_actions?.[ap.name];
  const list = Array.isArray(saved) ? saved : defaultActionsFor(ap);
  return list.filter((item) => isBotMode() || (item.cmd !== "/call" && !item.cmd.startsWith("/call ")));
}

async function saveProjectActions(nextMap) {
  if (actionsBusy) return false;
  actionsBusy = true;
  setActErr("");
  const addBtn = $("btn-save-action");
  const resetBtn = $("btn-reset-actions");
  if (addBtn) addBtn.disabled = true;
  if (resetBtn) resetBtn.disabled = true;
  try {
    const res = await api("/api/settings/ui", { project_actions: nextMap });
    if (STATE?.ui_prefs) STATE.ui_prefs.project_actions = res.project_actions || {};
    renderManageActions();
    renderActionsPane();
    return true;
  } catch (err) {
    setActErr(err.message || "Failed to save actions");
    return false;
  } finally {
    actionsBusy = false;
    renderManageActions();
  }
}

function renderManageActions() {
  const ap = STATE?.active_project;
  const list = $("act-manage-list");
  if (!list || !ap) return;
  $("act-modal-proj").textContent = projDisplay(ap.name);
  const resetBtn = $("btn-reset-actions");
  resetBtn.style.display = Array.isArray(STATE?.ui_prefs?.project_actions?.[ap.name]) ? "inline-flex" : "none";
  resetBtn.disabled = actionsBusy;
  list.innerHTML = "";
  const actions = getEffectiveActions(ap);
  const addBtn = $("btn-save-action");
  if (addBtn) {
    addBtn.disabled = actionsBusy || actions.length >= 16;
    addBtn.title = actions.length >= 16 ? "Maximum 16 actions per workspace" : "";
  }
  if (!actions.length) {
    list.innerHTML = `<div class="muted" style="padding:6px 2px;">No actions configured for this workspace.</div>`;
    return;
  }
  actions.forEach((item) => {
    const row = document.createElement("div");
    row.className = "act-row";
    row.style.cursor = "default";
    row.title = item.desc ? `${item.cmd} — ${item.desc}` : item.cmd;
    const descHtml = item.desc ? `<span class="act-desc" style="max-width:100%;">${esc(item.desc)}</span>` : "";
    row.innerHTML = `<span class="act-cmd"><span>${esc(item.cmd)}</span></span><div style="display:flex;align-items:center;gap:8px;min-width:0;max-width:50%;flex-shrink:0;">${descHtml}<button class="btn btn-sm btn-danger" style="padding:1px 5px;font-size:10px;flex-shrink:0;" title="Remove">✕</button></div>`;
    row.querySelector("button").onclick = async (e) => {
      e.stopPropagation();
      const nextMap = structuredClone(STATE?.ui_prefs?.project_actions || {});
      const base = Array.isArray(nextMap[ap.name]) ? [...nextMap[ap.name]] : [...defaultActionsFor(ap)];
      nextMap[ap.name] = base.filter((a) => a.cmd !== item.cmd);
      await saveProjectActions(nextMap);
    };
    list.appendChild(row);
  });

  const desc = $("act-input-desc").value.trim().slice(0, 60);

  const nextMap = structuredClone(STATE?.ui_prefs?.project_actions || {});
  const cur = Array.isArray(nextMap[ap.name]) ? [...nextMap[ap.name]] : [...defaultActionsFor(ap)];
  if (cur.length >= 16) { setActErr("Maximum 16 actions per workspace."); return; }

    row.innerHTML = `<span class="act-cmd">${ico}<span>${esc(item.cmd)}</span></span>${descHtml}`;
    row.onclick = (e) => {
      if (item.cmd === "/call") {
        openCallModal();
        return;
      }
      if (item.cmd === "/task" && !ap.task_md) {
        const inp = $("msg-input");
        if (!inp.value.startsWith("/task")) inp.value = "/task " + inp.value;
        resizeInput(); updateSendReady(); inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
        return;
      }
      if (item.cmd.startsWith("/call ") && !/^\/call\s+\S+:\s*\S/.test(item.cmd)) {
        const inp = $("msg-input");
        const prefix = item.cmd.includes(":") ? `${item.cmd} ` : `${item.cmd}: `;
        const curVal = inp.value.trimStart();
        inp.value = curVal && !curVal.startsWith("/") ? `${prefix}${curVal}` : prefix;
        resizeInput(); updateSendReady(); inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
        return;
      }
      if (e.shiftKey || item.cmd.endsWith(":")) {
        const inp = $("msg-input");
        inp.value = item.cmd.endsWith(" ") ? item.cmd : `${item.cmd} `;
        resizeInput(); updateSendReady(); inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
        return;
      }
      sendMessage(item.cmd);
    };
    list.appendChild(row);
  }
}

function buildBotCandidates(curMask, defMask, taken, page) {
  const out = [curMask];
  const seen = new Set([curMask]);
  if (defMask !== curMask && !taken.has(defMask)) {
    out.push(defMask);
    seen.add(defMask);
  }
  let s = (0x9e3779b9 ^ Math.imul(page + 1, 0x85ebca6b)) >>> 0;
  for (let guard = 0; out.length < 24 && guard < 4000; guard++) {
    s = (Math.imul(s ^ (s >>> 15), 0x85ebca6b) + 0x27d4eb2d) >>> 0;
    const m = (s & 0x7fff) | (1 << 4);
    if (seen.has(m) || taken.has(m)) continue;
    let bits = 0, top = 0, bot = 0;
    for (let i = 0; i < 15; i++) {
      if ((m >> i) & 1) { bits++; if (i < 6) top++; if (i >= 9) bot++; }
    }
    if (bits >= 6 && bits <= 11 && top >= 1 && bot >= 1) {
      out.push(m);
      seen.add(m);
    }
  }
  return out;
}

  grid.innerHTML = "";
  if (showIcons) {
    for (const m of buildBotCandidates(curMask, defMask, taken, botPage)) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "bot-opt" + (m === curMask ? " active" : "");
      b.innerHTML = botSvgFromMask(m, 22, m === curMask ? fill : "currentColor", m === curMask ? defs : "");
      const owner = taken.get(m);
      if (owner) {
        b.disabled = true;
        b.title = `Used by ${owner}`;
      } else {
        b.onclick = async () => {
          const nextBots = { ...(STATE.ui_prefs?.project_bots || {}) };
          if (m === defMask) delete nextBots[ap.name];
          else nextBots[ap.name] = `b:${m.toString(16).padStart(4, "0")}`;
          const res = await api("/api/settings/ui", { project_bots: nextBots });
          STATE.ui_prefs.project_bots = res.project_bots || nextBots;
          renderAll();
          renderBotPicker();
        };
      }
      grid.appendChild(b);
    }
  }

  const siblings = (STATE.projects || []).filter((p) => p.name !== ap.name);
  const csec = $("mb-collab-sec");
  const cbox = $("mb-collabs");
  csec.style.display = ap.is_agent && siblings.length ? "flex" : "none";
  cbox.innerHTML = "";
  if (ap.is_agent && siblings.length) {
    const activeCollabs = new Set(ap.collaborators || []);
    for (const p of siblings) {
      const on = activeCollabs.has(p.name);
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "collab-chip" + (on ? " on" : "");
      chip.innerHTML = `${botSvg(p.name, 12)}<span>${esc(projDisplay(p.name))}</span>`;
      chip.onclick = async () => {
        if (chip.disabled) return;
        chip.disabled = true;
        try {
        const nextSet = new Set(activeCollabs);
        if (on) nextSet.delete(p.name); else nextSet.add(p.name);
        const nextMap = structuredClone(STATE.ui_prefs?.project_collabs || {});
        nextMap[ap.name] = Array.from(nextSet);
        const payload = { project_collabs: nextMap };
        const savedActs = STATE.ui_prefs?.project_actions?.[ap.name];
        if (Array.isArray(savedActs)) {
          const cmd = `/call ${p.name}`;
          const nextActsMap = structuredClone(STATE.ui_prefs?.project_actions || {});
          if (on) {
            nextActsMap[ap.name] = savedActs.filter((a) => a.cmd !== cmd);
          } else if (!savedActs.some((a) => a.cmd === cmd || a.cmd.startsWith(`${cmd}:`))) {
            nextActsMap[ap.name] = [...savedActs, { cmd, desc: "Ask peer" }].slice(0, 16);
          }
          payload.project_actions = nextActsMap;
        }
          const res = await api("/api/settings/ui", payload);
          STATE.ui_prefs.project_collabs = res.project_collabs || {};
          if (res.project_actions) STATE.ui_prefs.project_actions = res.project_actions;
          ap.collaborators = res.project_collabs?.[ap.name] ?? nextMap[ap.name];
          renderBotPicker();
          renderActionsPane();
          renderTopbarProfile(ap);
          if ($("modal-actions").classList.contains("open")) renderManageActions();
        } finally {
          chip.disabled = false;
        }
      };
      cbox.appendChild(chip);
    }
  }
}

    if (e.key === "ArrowUp") { e.preventDefault(); acHl = (acHl + acItems.length - 1) % acItems.length; updateAutocomplete(); return; }
    if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) { e.preventDefault(); pickAcItem(acHl); return; }

  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
