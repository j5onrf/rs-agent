let callTarget = "", callMode = "none", callPickerOpen = false;
function renderCallModal() {
  const ap = STATE?.active_project;
  if (!ap) return;
  const siblings = (STATE?.projects || []).filter((p) => p.name !== ap.name);
  const tgt = siblings.find((p) => p.name === callTarget) || siblings[0] || null;
  callTarget = tgt ? tgt.name : "";

  const subRow = (...parts) => {
    const items = parts.filter(Boolean);
    return items.length ? `<span class="call-sub">${items.map((t) => `<span>${esc(t)}</span>`).join("")}</span>` : "";
  };
  const callerProv = STATE?.projects?.find((p) => p.name === ap.name)?.peer_provider || "";
  const callerHasMb = (ap.is_agent && (ap.collaborators || []).length > 0) || Boolean(callerProv);
  $("call-caller").innerHTML = `${botSvg(ap.name, 18)}<span class="call-meta"><span class="call-name">${esc(projDisplay(ap.name))}</span>${subRow(callerHasMb ? "mb" : "", callerProv)}</span>`;
  const tgtSub = (p) => subRow(
    p.name === "chat" ? "no tools" : "",
    (ap.collaborators || []).includes(p.name) ? "linked" : "",
    p.peer_provider
  );
  const tbtn = $("call-target-btn");
  if (tgt) {
    tbtn.disabled = false;
    tbtn.innerHTML = `${botSvg(tgt.name, 18)}<span class="call-meta"><span class="call-name">${esc(projDisplay(tgt.name))}</span>${tgtSub(tgt)}</span><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4.5 6.5L8 10l3.5-3.5"/></svg>`;
  } else {
    tbtn.disabled = true;
    tbtn.innerHTML = `<span class="call-meta"><span class="call-name">No sibling bots</span><span class="call-sub">Create another project first</span></span>`;
  }

  const tlist = $("call-targets");
  tlist.innerHTML = "";
  tlist.classList.toggle("open", callPickerOpen && siblings.length > 0);
  tbtn.classList.toggle("open", callPickerOpen && siblings.length > 0);
  for (const p of siblings) {
    const opt = document.createElement("button");
    opt.type = "button";
    opt.className = "call-target-opt" + (tgt && tgt.name === p.name ? " active" : "");
    opt.innerHTML = `<span style="display:flex;align-items:center;gap:8px;min-width:0;">${botSvg(p.name, 15)}<span class="call-meta"><span class="call-name">${esc(projDisplay(p.name))}</span>${tgtSub(p)}</span></span><span class="muted">${tgt && tgt.name === p.name ? "✓" : ""}</span>`;
    opt.onclick = () => {
      callTarget = p.name;
      callPickerOpen = false;
      renderCallModal();
      $("call-prompt").focus();
    };
    tlist.appendChild(opt);
  }

  $("btn-call-none").classList.toggle("active", callMode === "none");
  $("btn-call-last").classList.toggle("active", callMode === "last_turn");
  $("btn-call-full").classList.toggle("active", callMode === "full");
  $("call-mode-hint").textContent = callMode === "none"
    ? "Sends only your prompt (no chat history)"
    : (callMode === "full"
      ? "Sends conversation transcript + your prompt"
      : "Sends caller's last turn + your prompt");
  $("btn-run-call").disabled = !tgt || STREAMING;
  if (!tgt) $("call-err").textContent = "Create another project workspace first to consult a peer bot.";
}

function openCallModal(prefTarget, prefPrompt) {
  if (STREAMING || !STATE?.active_project) return;
  const ap = STATE.active_project;
  const siblings = (STATE.projects || []).filter((p) => p.name !== ap.name);
  const q = String(prefTarget || "").trim().toLowerCase();
  const matched = q
    ? siblings.find((p) => p.name.toLowerCase() === q) || siblings.find((p) => p.name.toLowerCase().startsWith(q))
    : null;
  const linked = (ap.collaborators || []).find((c) => siblings.some((p) => p.name === c));
  callTarget = matched
    ? matched.name
    : (linked || siblings.find((p) => p.peer_provider)?.name || siblings.find((p) => p.name !== "chat")?.name || siblings[0]?.name || "");
  callMode = "none";
  callPickerOpen = !matched && siblings.length > 1;
  $("call-err").textContent = "";
  if (typeof prefPrompt === "string") $("call-prompt").value = prefPrompt;
  renderCallModal();
  $("modal-call").classList.add("open");
  $("call-prompt").focus();
}

async function executePeerCall(target, mode, prompt) {
  if (STREAMING) return;
  STREAMING = true;
  $("btn-send").style.display = "none";
  $("btn-stop").style.display = "inline-flex";
  const stream = $("stream");
  if ($("empty-state")) stream.innerHTML = "";
  document.querySelector(".center").classList.remove("is-empty");
  let wrap = stream.querySelector(".turn-wrap");
  if (!wrap) { wrap = document.createElement("div"); wrap.className = "turn-wrap"; stream.appendChild(wrap); }
  const pending = document.createElement("div");
  pending.className = "peer-card";
  pending.innerHTML = `<div class="peer-head" style="cursor:default;"><div class="peer-title">${botSvg(target, 14)}<strong>${esc(projDisplay(target))}</strong><span class="peer-tag">${esc(mode.replace("_", " "))}</span><span class="peer-brief">${esc(prompt)}</span></div><span class="muted">calling...</span></div>`;
  wrap.appendChild(pending);
  stream.scrollTop = stream.scrollHeight;

  let callErr = null;
  try {
    const res = await api("/api/bot/call", { target, mode, prompt });
    if (res?.cancelled) callErr = null;
  } catch (err) {
    callErr = err.message;
  } finally {
    STREAMING = false;
    $("btn-send").style.display = "inline-flex";
    $("btn-stop").style.display = "none";
    await loadState();
    if (callErr) {
      const ec = document.createElement("div");
      ec.className = "err-card";
      ec.innerHTML = `<div class="err-msg">⚠ ${esc(callErr)}</div><div class="err-acts"><button class="btn btn-sm">Try again</button></div>`;
      ec.querySelector("button").onclick = () => executePeerCall(target, mode, prompt);
      stream.appendChild(ec);
      stream.scrollTop = stream.scrollHeight;
    }
  }
}

$("btn-close-call").onclick = $("btn-cancel-call").onclick = () => $("modal-call").classList.remove("open");
$("call-target-btn").onclick = () => { callPickerOpen = !callPickerOpen; renderCallModal(); };
$("btn-call-none").onclick = () => { callMode = "none"; renderCallModal(); };
$("btn-call-last").onclick = () => { callMode = "last_turn"; renderCallModal(); };
$("btn-call-full").onclick = () => { callMode = "full"; renderCallModal(); };
$("btn-run-call").onclick = async () => {
  const prompt = $("call-prompt").value.trim();
  if (!callTarget) { $("call-err").textContent = "Select a target bot."; return; }
  if (!prompt) { $("call-err").textContent = "Enter a question or task for the target bot."; $("call-prompt").focus(); return; }
  $("call-err").textContent = "";
  $("call-prompt").value = "";
  $("modal-call").classList.remove("open");
  await executePeerCall(callTarget, callMode, prompt);
};
$("call-prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("btn-run-call").click(); }
});

  if (STATE?.ui_prefs && STATE.ui_prefs.bot_mode !== isBotMode()) {
    api("/api/settings/ui", { bot_mode: isBotMode() })
      .then((r) => { if (STATE?.ui_prefs) STATE.ui_prefs.bot_mode = r.bot_mode; })
      .catch(() => {});
  }
});

let lastThemeSig = "", lastThemeSync = 0;
async function syncThemes(force) {
  if (document.hidden || !STATE) return;
  const id = getAppearance().theme;
  if (!force && id !== "omarchy" && id !== "noctalia" && !id.startsWith("custom:")) return;
  const now = Date.now();
  if (!force && now - lastThemeSync < 1500) return;
  lastThemeSync = now;
  try {
    const res = await api("/api/themes");
    const sig = JSON.stringify(res.themes || []);
    if (sig !== lastThemeSig) {
      lastThemeSig = sig;
      STATE.themes = res.themes || [];
      applyAppearance();
      if ($("modal-settings").classList.contains("open") && ACTIVE_TAB === "appearance") renderModalTab();
    }
  } catch {}
}
window.addEventListener("focus", () => syncThemes(false));
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncThemes(false); });
