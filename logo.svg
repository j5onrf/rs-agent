<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <defs>
            <linearGradient id="r5-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00F2FE"></stop>
              <stop offset="100%" stop-color="#3A7BD5"></stop>
            </linearGradient>
          </defs>
          <g transform="translate(150,150)">
            <!-- 3 smooth curved radiation lobes rendered with py-agent rounded stroke style -->
            <path d="M 0 -25 C 20 -40, 50 -90, 0 -95 C -50 -90, -20 -40, 0 -25 Z" fill="url(#r5-grad)" opacity="0.95"></path>
            <path d="M 0 -25 C 20 -40, 50 -90, 0 -95 C -50 -90, -20 -40, 0 -25 Z" fill="url(#r5-grad)" opacity="0.95" transform="rotate(120)"></path>
            <path d="M 0 -25 C 20 -40, 50 -90, 0 -95 C -50 -90, -20 -40, 0 -25 Z" fill="url(#r5-grad)" opacity="0.95" transform="rotate(240)"></path>
            <!-- Nuclear Center -->
            <circle cx="0" cy="0" r="20" fill="#0d1117" stroke="#00F2FE" stroke-width="7"></circle>
            <circle cx="0" cy="0" r="6" fill="#FFFFFF"></circle>
          </g>
        </svg>
