<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <defs>
            <linearGradient id="r4-a" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00F2FE"></stop>
              <stop offset="100%" stop-color="#3A7BD5"></stop>
            </linearGradient>
            <linearGradient id="r4-b" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4FACFE"></stop>
              <stop offset="100%" stop-color="#00F2FE"></stop>
            </linearGradient>
          </defs>
          <g transform="translate(150,150)">
            <!-- Elliptical Orbital Ring A -->
            <ellipse cx="0" cy="0" rx="100" ry="40" fill="none" stroke="url(#r4-a)" stroke-width="26" transform="rotate(-30)"></ellipse>
            <!-- Elliptical Orbital Ring B (Overlapping) -->
            <ellipse cx="0" cy="0" rx="100" ry="40" fill="none" stroke="url(#r4-b)" stroke-width="26" stroke-opacity="0.85" transform="rotate(30)"></ellipse>
            <!-- Center Nuclear Core (Fissile Node) -->
            <circle cx="0" cy="0" r="24" fill="#0d1117" stroke="#FFFFFF" stroke-width="6"></circle>
            <circle cx="0" cy="0" r="10" fill="#00F2FE"></circle>
            <!-- Orbiting Particle Dots -->
            <circle cx="-75" cy="-42" r="12" fill="#00F2FE"></circle>
            <circle cx="75" cy="42" r="12" fill="#3A7BD5"></circle>
          </g>
        </svg>
