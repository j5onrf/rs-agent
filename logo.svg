<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <defs>
            <linearGradient id="r7-border" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00F2FE"></stop>
              <stop offset="100%" stop-color="#3A7BD5"></stop>
            </linearGradient>
          </defs>
          <!-- Rounded Element Tile -->
          <rect x="45" y="45" width="210" height="210" rx="36" fill="#161b22" stroke="url(#r7-border)" stroke-width="12"></rect>
          <!-- Atomic Number 26 (Iron / Rust) or 239 -->
          <text x="75" y="95" font-family="monospace" font-size="28" font-weight="bold" fill="#00F2FE">26</text>
          <!-- Element Symbol "Rs" -->
          <text x="150" y="180" font-family="-apple-system, monospace" font-size="78" font-weight="900" fill="#FFFFFF" text-anchor="middle">Rs</text>
          <!-- Atomic Weight / Subtitle -->
          <text x="150" y="222" font-family="monospace" font-size="16" letter-spacing="2" fill="#4FACFE" text-anchor="middle">&lt; 1ms • NATIVE</text>
          <!-- Corner Glowing Node -->
          <circle cx="225" cy="75" r="8" fill="#00F2FE"></circle>
        </svg>
