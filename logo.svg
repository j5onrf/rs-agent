<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <defs>
            <linearGradient id="p1-left" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00F2FE"></stop>
              <stop offset="100%" stop-color="#4FACFE"></stop>
            </linearGradient>
            <linearGradient id="p1-right" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4FACFE"></stop>
              <stop offset="100%" stop-color="#3A7BD5"></stop>
            </linearGradient>
            <linearGradient id="p1-base" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1E3C72"></stop>
              <stop offset="100%" stop-color="#0f172a"></stop>
            </linearGradient>
          </defs>
          <!-- Base shadow/depth -->
          <polygon points="50,230 150,270 250,230 150,215" fill="url(#p1-base)" opacity="0.6"></polygon>
          <!-- Left face (bright) -->
          <polygon points="150,45 50,230 150,270" fill="url(#p1-left)"></polygon>
          <!-- Right face (shaded) -->
          <polygon points="150,45 150,270 250,230" fill="url(#p1-right)" opacity="0.9"></polygon>
          <!-- Ridge Highlight -->
          <line x1="150" y1="45" x2="150" y2="270" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4"></line>
          <!-- Apex Glow Dot -->
          <circle cx="150" cy="45" r="5" fill="#00F2FE"></circle>
        </svg>
