<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <defs>
            <linearGradient id="b2-hex" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00F2FE"></stop>
              <stop offset="50%" stop-color="#4FACFE"></stop>
              <stop offset="100%" stop-color="#3A7BD5"></stop>
            </linearGradient>
          </defs>
          <g transform="translate(150,150)">
            <!-- Outer Hexagon chassis with corner gear teeth -->
            <polygon points="0,-95 82,-48 82,48 0,95 -82,48 -82,-48" fill="none" stroke="url(#b2-hex)" stroke-width="16" stroke-linejoin="round"></polygon>
            <!-- 6 Corner Teeth -->
            <rect x="-8" y="-110" width="16" height="18" rx="3" fill="url(#b2-hex)"></rect>
            <rect x="-8" y="-110" width="16" height="18" rx="3" fill="url(#b2-hex)" transform="rotate(60)"></rect>
            <rect x="-8" y="-110" width="16" height="18" rx="3" fill="url(#b2-hex)" transform="rotate(120)"></rect>
            <rect x="-8" y="-110" width="16" height="18" rx="3" fill="url(#b2-hex)" transform="rotate(180)"></rect>
            <rect x="-8" y="-110" width="16" height="18" rx="3" fill="url(#b2-hex)" transform="rotate(240)"></rect>
            <rect x="-8" y="-110" width="16" height="18" rx="3" fill="url(#b2-hex)" transform="rotate(300)"></rect>
            <!-- Inner Hex Core (Cargo Crate) -->
            <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="url(#b2-hex)" opacity="0.8"></polygon>
            <circle cx="0" cy="0" r="14" fill="#0d1117"></circle>
            <circle cx="0" cy="0" r="5" fill="#00F2FE"></circle>
          </g>
        </svg>
