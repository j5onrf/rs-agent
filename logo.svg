<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
          <defs>
            <linearGradient id="g1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00F2FE"></stop>
              <stop offset="100%" stop-color="#3A7BD5"></stop>
            </linearGradient>
          </defs>
          <!-- 6 prominent teeth: read, edit, write, list, search, run -->
          <g transform="translate(150,150)">
            <circle cx="0" cy="0" r="75" fill="none" stroke="url(#g1-grad)" stroke-width="26"></circle>
            <!-- 6 teeth -->
            <rect x="-13" y="-105" width="26" height="26" rx="4" fill="url(#g1-grad)"></rect>
            <rect x="-13" y="79" width="26" height="26" rx="4" fill="url(#g1-grad)"></rect>
            <rect x="-13" y="-105" width="26" height="26" rx="4" fill="url(#g1-grad)" transform="rotate(60)"></rect>
            <rect x="-13" y="79" width="26" height="26" rx="4" fill="url(#g1-grad)" transform="rotate(60)"></rect>
            <rect x="-13" y="-105" width="26" height="26" rx="4" fill="url(#g1-grad)" transform="rotate(120)"></rect>
            <rect x="-13" y="79" width="26" height="26" rx="4" fill="url(#g1-grad)" transform="rotate(120)"></rect>
            <!-- Center Core Hub -->
            <circle cx="0" cy="0" r="32" fill="#0d1117" stroke="url(#g1-grad)" stroke-width="8"></circle>
            <circle cx="0" cy="0" r="10" fill="#00F2FE"></circle>
          </g>
        </svg>
