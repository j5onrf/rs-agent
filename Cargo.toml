[package]
name = "rs-agent"
version = "0.4.0"
edition = "2021"

[workspace]
members = [
    ".",
    "plugins/t3code"
]

[lib]
name = "rs_agent"
path = "src/lib.rs"

[[bin]]
name = "rs-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
crossterm = "0.27"
dirs = "5.0"
eventsource-stream = "0.2"
futures-util = "0.3"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
