[package]
name = "rs-agent"
version = "0.5.7"
edition = "2021"

[workspace]
members = [
    ".",
    "plugins/t3code",
    "tools/model-select",
    "tools/new-project",
    "tools/test-agent",
]

[lib]
name = "rs_agent"
path = "src/lib.rs"

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
crossterm = "0.27"
dirs = "5.0"
eventsource-stream = "0.2"
futures-util = "0.3"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
